<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖 你爱我吗</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #ffd6e0, #ffb3c6, #ff8fab, #ff6b8a);
            background-size: 400% 400%;
            animation: bgShift 8s ease infinite;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes bgShift {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .hearts-rain {
            position: fixed;
            top: -5%;
            left: 0;
            width: 100%;
            height: 110%;
            pointer-events: none;
            z-index: 1;
        }

        .rain-heart {
            position: absolute;
            animation: heartFall linear infinite;
        }

        @keyframes heartFall {
            0% {
                transform: translateY(-5vh) rotate(0deg) scale(0.4);
                opacity: 0.85;
            }
            85% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(108vh) rotate(720deg) scale(1.1);
                opacity: 0;
            }
        }

        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 45px;
            padding: 50px 35px 45px;
            width: 90%;
            max-width: 460px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            text-align: center;
            animation: cardBounceIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes cardBounceIn {
            0% {
                opacity: 0;
                transform: scale(0.2) translateY(80px);
            }
            50% {
                transform: scale(1.08) translateY(-15px);
            }
            70% {
                transform: scale(0.94) translateY(5px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .big-heart {
            font-size: 80px;
            animation: heartbeat 1.2s ease-in-out infinite;
            display: inline-block;
            margin-bottom: 15px;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            15% {
                transform: scale(1.25);
            }
            30% {
                transform: scale(1);
            }
            45% {
                transform: scale(1.2);
            }
            60% {
                transform: scale(1);
            }
        }

        .question {
            font-size: 2.2rem;
            font-weight: bold;
            color: #c9184a;
            margin-bottom: 8px;
            letter-spacing: 3px;
            text-shadow: 0 3px 15px rgba(201, 24, 74, 0.2);
        }

        .hint {
            font-size: 1rem;
            color: #8b5e6b;
            margin-bottom: 35px;
            font-weight: 500;
        }

        .buttons-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
            min-height: 80px;
            transition: all 0.3s ease;
        }

        .btn {
            border: none;
            border-radius: 60px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 3px;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
            position: relative;
            white-space: nowrap;
            outline: none;
        }

        .btn-love {
            background: linear-gradient(135deg, #ff4d6d, #e63946);
            color: white;
            font-size: 20px;
            padding: 18px 48px;
            z-index: 5;
            animation: pulseLove 2s ease-in-out infinite;
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        @keyframes pulseLove {
            0%, 100% {
                box-shadow: 0 12px 30px rgba(230, 57, 70, 0.4);
            }
            50% {
                box-shadow: 0 22px 50px rgba(230, 57, 70, 0.7), 0 0 0 20px rgba(230, 57, 70, 0.08);
            }
        }

        .btn-love:active {
            transform: scale(0.93);
        }

        .btn-hate {
            background: rgba(200, 200, 200, 0.6);
            color: #777;
            font-size: 16px;
            padding: 14px 32px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(180, 180, 180, 0.5);
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .result-msg {
            margin-top: 30px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #c9184a;
            min-height: 45px;
            transition: all 0.5s ease;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .heart-boom {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 180px;
            z-index: 200;
            pointer-events: none;
            animation: heartBoom 1s ease-out forwards;
        }

        @keyframes heartBoom {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 1;
            }
            40% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(2.5);
                opacity: 0;
            }
        }

        .spark {
            position: fixed;
            pointer-events: none;
            z-index: 210;
            animation: sparkFly 1.5s ease-out forwards;
        }

        @keyframes sparkFly {
            0% {
                transform: translate(0, 0) scale(0) rotate(0deg);
                opacity: 1;
            }
            70% {
                opacity: 0.9;
            }
            100% {
                transform: translate(var(--sx), var(--sy)) scale(1.8) rotate(var(--sr));
                opacity: 0;
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 35px 18px 30px;
                border-radius: 35px;
            }
            .question {
                font-size: 1.7rem;
            }
            .big-heart {
                font-size: 60px;
            }
            .btn-love {
                font-size: 17px;
                padding: 15px 35px;
            }
            .btn-hate {
                font-size: 14px;
                padding: 12px 24px;
            }
            .buttons-area {
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="hearts-rain" id="heartsRain"></div>

    <div class="card" id="mainCard">
        <div class="big-heart">💖</div>
        <div class="question">你爱我吗</div>
        <div class="hint">请摸着良心回答 🤔</div>

        <div class="buttons-area" id="buttonsArea">
            <button class="btn btn-love" id="btnLove">爱 💕</button>
            <button class="btn btn-hate" id="btnHate">不爱 💔</button>
        </div>

        <div class="result-msg" id="resultMsg"></div>
    </div>

    <script>
        (function() {
            const heartsRain = document.getElementById('heartsRain');
            const heartEmojis = ['❤️', '💕', '💖', '💗', '💓', '💝', '💘', '🩷', '💞', '💟', '❣️', '♥️'];

            function createRainHeart() {
                const heart = document.createElement('span');
                heart.className = 'rain-heart';
                heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.fontSize = (Math.random() * 26 + 14) + 'px';
                heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
                heart.style.animationDelay = Math.random() * 4 + 's';
                heartsRain.appendChild(heart);
                heart.addEventListener('animationend', () => heart.remove());
            }

            for (let i = 0; i < 15; i++) {
                setTimeout(createRainHeart, i * 300);
            }
            setInterval(createRainHeart, 1200);

            const btnLove = document.getElementById('btnLove');
            const btnHate = document.getElementById('btnHate');
            const resultMsg = document.getElementById('resultMsg');
            const bigHeart = document.querySelector('.big-heart');
            const questionEl = document.querySelector('.question');

            let hateClickCount = 0;

            // 初始值（单位px）
            let loveFontSize = 20;
            let lovePaddingH = 48;
            let hateFontSize = 16;
            let hatePaddingH = 32;

            const hateMessages = [
                '😢 你再想想...',
                '🥺 真的不爱吗？',
                '😭 我不信！',
                '💔 心碎了...',
                '😤 再给你一次机会！',
                '🫠 我不接受这个答案',
                '😩 你手滑了吧？',
                '🙏 拜托再考虑一下',
                '🤧 呜呜呜...',
                '😵 我不听我不听',
                '💢 你一定是点错了',
                '😿 最后一次机会...',
            ];

            function spawnFireworks(x, y) {
                const emojis = ['❤️', '💖', '💕', '💘', '✨', '💗', '🌟', '💝', '🥰', '😍', '🎉', '💞', '💓', '🩷'];
                const count = 50;
                for (let i = 0; i < count; i++) {
                    const spark = document.createElement('span');
                    spark.className = 'spark';
                    spark.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    spark.style.left = x + 'px';
                    spark.style.top = y + 'px';
                    spark.style.fontSize = (Math.random() * 22 + 16) + 'px';
                    const angle = Math.random() * Math.PI * 2;
                    const distance = 100 + Math.random() * 250;
                    spark.style.setProperty('--sx', Math.cos(angle) * distance + 'px');
                    spark.style.setProperty('--sy', Math.sin(angle) * distance + 'px');
                    spark.style.setProperty('--sr', (Math.random() * 720 - 360) + 'deg');
                    spark.style.animationDuration = (Math.random() * 1 + 1.2) + 's';
                    document.body.appendChild(spark);
                    spark.addEventListener('animationend', () => spark.remove());
                }
            }

            function spawnHeartBoom() {
                const boom = document.createElement('div');
                boom.className = 'heart-boom';
                boom.textContent = '💖';
                document.body.appendChild(boom);
                boom.addEventListener('animationend', () => boom.remove());
            }

            btnLove.addEventListener('click', function(e) {
                const rect = btnLove.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                spawnFireworks(cx, cy);
                spawnHeartBoom();
                resultMsg.innerHTML = '💗 我也爱你！永远在一起！💗';
                resultMsg.style.fontSize = '1.5rem';
                resultMsg.style.color = '#e63946';
                bigHeart.textContent = '🥰';
                questionEl.textContent = '我爱你！';
                document.querySelector('.hint').textContent = '从今天开始，你是我的全世界 🌍';
                btnHate.style.display = 'none';
                btnLove.disabled = true;
                btnLove.textContent = '💑 已锁定';
                btnLove.style.animation = 'none';
                btnLove.style.opacity = '0.8';
                btnLove.style.pointerEvents = 'none';
            });

            btnHate.addEventListener('click', function(e) {
                hateClickCount++;

                // 显示骚话
                const msgIndex = (hateClickCount - 1) % hateMessages.length;
                resultMsg.innerHTML = hateMessages[msgIndex];
                resultMsg.style.animation = 'none';
                resultMsg.offsetHeight;
                resultMsg.style.animation = 'fadeInUp 0.5s ease';

                // ===== 不爱按钮缩小 =====
                hateFontSize = Math.max(6, hateFontSize * 0.75);
                hatePaddingH = Math.max(6, hatePaddingH * 0.7);
                btnHate.style.fontSize = hateFontSize + 'px';
                btnHate.style.padding = (hatePaddingH * 0.8) + 'px ' + hatePaddingH + 'px';
                btnHate.style.opacity = Math.max(0.2, 1 - hateClickCount * 0.08);

                // ===== 爱按钮放大 =====
                loveFontSize = Math.min(60, loveFontSize * 1.2);
                lovePaddingH = Math.min(80, lovePaddingH * 1.15);
                btnLove.style.fontSize = loveFontSize + 'px';
                btnLove.style.padding = (lovePaddingH * 0.85) + 'px ' + lovePaddingH + 'px';
                btnLove.style.boxShadow = '0 ' + (15 + hateClickCount * 4) + 'px ' + (35 + hateClickCount * 6) + 'px rgba(230, 57, 70, 0.6)';

                // 不爱按钮抖动逃跑
                if (hateClickCount > 2) {
                    const offsetX = (Math.random() - 0.5) * hateClickCount * 10;
                    const offsetY = (Math.random() - 0.5) * hateClickCount * 8;
                    btnHate.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
                }

                // 15次后不爱按钮消失
                if (hateClickCount >= 15) {
                    btnHate.style.display = 'none';
                    resultMsg.innerHTML = '💘 没有不爱的选项哦！你只能爱我！';
                }
            });
        })();
    </script>
</body>
</html>
