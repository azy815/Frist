<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>你爱我吗 💕 粉金玫瑰</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;min-height:100vh;overflow:hidden}
        body{min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'PingFang SC','Microsoft YaHei',sans-serif;padding:16px;background:radial-gradient(ellipse at center,#fff5f7,#ffe8ee,#ffdce6);background-size:100% 100%;transition:background .8s ease;overflow:hidden}
        body.pink-bg{background:radial-gradient(ellipse at center,#ffe4ec,#ffd0d8,#ffb8c6)!important}
        body.dark-bg{background:radial-gradient(ellipse at center,#0d0d1a,#08080e,#040408)!important}

        .card{position:relative;z-index:20;background:rgba(255,255,255,.35);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:32px 20px;border-radius:40px;text-align:center;max-width:400px;width:100%;border:1px solid rgba(255,255,255,.4);margin:0 auto;transition:all .5s ease}
        .card.champagne{background:linear-gradient(145deg,#f5e6d3,#ecd4c0,#e8c8b0)!important;backdrop-filter:none!important;border:2px solid #d4a86a!important}
        .card.hide{opacity:0;transform:scale(.9) translateY(20px);pointer-events:none}
        .card.hidden{display:none}

        .big-heart{font-size:56px;animation:pulse 1.6s ease-in-out infinite;display:inline-block}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
        .question{font-size:24px;font-weight:700;color:#5a3d4a;margin:10px 0 4px}
        .hint{color:rgba(90,61,74,.6);font-size:14px;margin-bottom:20px}
        .love-verse{color:rgba(90,61,74,.5);font-size:13px;font-weight:300;letter-spacing:2px;margin-top:14px;border-top:1px solid rgba(200,100,120,.1);padding-top:14px;font-style:italic}
        .love-verse .highlight{color:#d47a8a;font-weight:500}

        .btn-group{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
        .btn{padding:14px 32px;border:none;border-radius:60px;font-size:18px;font-weight:700;cursor:pointer;transition:all .2s;min-width:100px;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent}
        .btn:active{transform:scale(.94)}
        .btn-love{background:linear-gradient(135deg,#f5a0b0,#e88090);color:#fff}
        .btn-hate{background:rgba(200,150,160,.15);color:rgba(90,61,74,.5);border:1px solid rgba(200,150,160,.15)}
        .btn-primary{background:linear-gradient(135deg,#e8b0c0,#d490a0);color:#fff}
        .btn-gold{background:linear-gradient(135deg,#d4a86a,#c89850);color:#fff;box-shadow:0 6px 30px rgba(180,130,80,.3)}
        .result{margin-top:18px;font-size:18px;font-weight:600;color:#5a3d4a;min-height:44px}
        .card-stage2{display:none}.card-stage2.active{display:block}
        .card-stage3{display:none}.card-stage3.active{display:block}

        .bless{position:fixed;z-index:25;font-size:16px;font-weight:600;color:#5a3d2a;padding:10px 22px;border-radius:30px;background:linear-gradient(145deg,#f5e6d3,#ecd4c0,#e8c8b0);border:2px solid #d4a86a;box-shadow:0 4px 20px rgba(180,130,80,.2);white-space:nowrap;animation:floatBless linear forwards;opacity:0;cursor:pointer;transition:all .3s ease;user-select:none;-webkit-tap-highlight-color:transparent}
        .bless:active{transform:scale(.95)}
        @keyframes floatBless{0%{opacity:0;transform:translateY(20px) scale(.9)}12%{opacity:1;transform:translateY(0) scale(1)}85%{opacity:1;transform:translateY(-100px) scale(1)}100%{opacity:0;transform:translateY(-160px) scale(.9)}}

        #popup{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:9999;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
        #popup.show{display:flex}
        .popup-content{background:linear-gradient(145deg,#fff5f0,#fce8e0,#f5d8d0);border-radius:30px;padding:36px 28px;max-width:420px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.3);border:2px solid #d4a86a;animation:popUp .4s cubic-bezier(.34,1.56,.64,1)}
        @keyframes popUp{0%{opacity:0;transform:scale(.8) translateY(30px)}100%{opacity:1;transform:scale(1) translateY(0)}}
        .popup-title{font-size:22px;font-weight:700;color:#5a3d2a;margin-bottom:12px;text-align:center}
        .popup-body{font-size:16px;line-height:1.8;color:#4a3d3a;text-align:left;white-space:pre-wrap;word-break:break-word}
        .popup-close{display:block;margin:18px auto 0;padding:12px 40px;border:none;border-radius:60px;background:linear-gradient(135deg,#f5a0b0,#e88090);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s}
        .popup-close:active{transform:scale(.94)}

        #nameInput{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:9998;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
        #nameInput.show{display:flex}
        .name-box{background:linear-gradient(145deg,#fff5f0,#fce8e0,#f5d8d0);border-radius:40px;padding:36px 28px;max-width:420px;width:90%;border:2px solid #d4a86a;box-shadow:0 30px 80px rgba(0,0,0,.3);text-align:center}
        .name-box h2{font-size:22px;color:#5a3d2a;margin-bottom:8px}
        .name-box .sub-hint{font-size:14px;color:rgba(90,61,42,.6);margin-bottom:20px;line-height:1.6}
        .name-box input{width:100%;padding:16px 20px;border:2px solid #d4a86a;border-radius:30px;font-size:20px;font-family:'PingFang SC','Microsoft YaHei',sans-serif;outline:none;background:rgba(255,255,255,.6);transition:all .3s;text-align:center;color:#5a3d2a;letter-spacing:2px}
        .name-box input:focus{border-color:#c89850;background:rgba(255,255,255,.8);box-shadow:0 0 30px rgba(180,130,80,.15)}
        .name-box input::placeholder{color:rgba(90,61,42,.25);font-size:16px;letter-spacing:0}
        .name-box .btn-group{margin-top:20px;gap:12px}
        .name-box .btn{min-width:120px}

        #poemDisplay{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:9997;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:20px}
        #poemDisplay.show{display:flex}
        .poem-box{background:linear-gradient(145deg,#fff5f0,#fce8e0,#f5d8d0);border-radius:40px;padding:36px 28px;max-width:500px;width:100%;max-height:85vh;overflow-y:auto;border:2px solid #d4a86a;box-shadow:0 30px 80px rgba(0,0,0,.3);text-align:center}
        .poem-box h2{font-size:20px;color:#5a3d2a;margin-bottom:4px}
        .poem-box .sub{font-size:13px;color:rgba(90,61,42,.5);margin-bottom:12px}
        .poem-divider{width:60px;height:2px;background:linear-gradient(90deg,transparent,#d4a86a,transparent);margin:14px auto}
        .poem-text{font-size:16px;line-height:2.2;color:#4a3d3a;white-space:pre-wrap;font-family:'PingFang SC','Microsoft YaHei',serif;letter-spacing:1px}
        .poem-box .btn{margin-top:18px}

        /* 浪漫授权弹窗 */
        .auth-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:99999;display:flex;justify-content:center;align-items:center;background:rgba(10,10,26,0.7);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);animation:fadeInAuth .6s ease}
        @keyframes fadeInAuth{0%{opacity:0}100%{opacity:1}}
        @keyframes floatUpAuth{0%{opacity:0;transform:translateY(40px) scale(0.92)}100%{opacity:1;transform:translateY(0) scale(1)}}
        @keyframes shakeAuth{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
        .auth-box{background:linear-gradient(145deg,rgba(255,245,240,0.98),rgba(252,232,224,0.98),rgba(245,216,208,0.98));border-radius:48px;padding:44px 36px;max-width:440px;width:92%;border:2px solid rgba(212,168,106,0.25);box-shadow:0 40px 100px rgba(0,0,0,0.3);text-align:center;animation:floatUpAuth 0.7s cubic-bezier(0.34,1.56,0.64,1);position:relative;overflow:hidden}
        .auth-box::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 30% 20%,rgba(255,182,193,0.06),transparent 60%);pointer-events:none}
        .auth-icon{font-size:52px;margin-bottom:10px;display:block}
        .auth-title{font-size:22px;font-weight:700;color:#5a3d2a;margin-bottom:6px;letter-spacing:1px}
        .auth-desc{font-size:14px;color:rgba(90,61,42,0.6);margin-bottom:8px;line-height:1.7}
        .auth-secret{font-size:12px;color:rgba(90,61,42,0.3);margin-bottom:22px;letter-spacing:3px;font-style:italic}
        .auth-input{width:100%;padding:16px 22px;border:2px solid rgba(212,168,106,0.2);border-radius:60px;font-size:18px;font-family:'PingFang SC','Microsoft YaHei',sans-serif;outline:none;background:rgba(255,255,255,0.4);transition:all .3s;text-align:center;color:#5a3d2a;letter-spacing:3px;box-sizing:border-box}
        .auth-input:focus{border-color:#d4a86a;background:rgba(255,255,255,0.7);box-shadow:0 0 0 4px rgba(212,168,106,0.08)}
        .auth-input::placeholder{color:rgba(90,61,42,0.2);font-size:15px;letter-spacing:0}
        .auth-btn-group{display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap}
        .auth-btn{padding:14px 40px;border:none;border-radius:60px;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;flex:1;min-width:120px}
        .auth-btn:active{transform:scale(.94)}
        .auth-btn-primary{background:linear-gradient(135deg,#f5a0b0,#e88090);color:#fff;box-shadow:0 6px 30px rgba(232,128,144,0.2)}
        .auth-btn-secondary{background:rgba(200,150,160,0.08);color:rgba(90,61,42,0.35);border:1px solid rgba(200,150,160,0.08)}
        .auth-footer{font-size:11px;color:rgba(90,61,42,0.2);margin-top:16px;letter-spacing:1px}

        /* 笔画融合艺术画 */
        .art-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:99996;display:none;justify-content:center;align-items:center;background:radial-gradient(ellipse at center,#0d0d1a,#08080e,#040408);padding:20px}
        .art-overlay.show{display:flex}
        .art-box{text-align:center;max-width:560px;width:100%;animation:floatUpAuth 0.8s cubic-bezier(.34,1.56,.64,1)}
        .art-title{font-size:14px;color:rgba(255,255,255,0.2);letter-spacing:4px;font-weight:300;margin-bottom:20px}
        .art-canvas-wrap{position:relative;width:100%;padding:20px;border:1px solid rgba(255,255,255,0.04);border-radius:24px;background:rgba(255,255,255,0.01);min-height:200px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px}
        .art-stroke{display:inline-block;font-weight:900;font-size:min(10vw,48px);transition:all .8s cubic-bezier(.34,1.56,.64,1);cursor:default;opacity:0;transform:scale(0.3) rotate(-20deg)}
        .art-stroke.show{opacity:1;transform:scale(1) rotate(0deg)}
        .art-stroke.pink{background:linear-gradient(135deg,#ff6b9d,#ffb6d9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 20px rgba(255,107,157,0.15))}
        .art-stroke.gold{background:linear-gradient(135deg,#ffd700,#ffb347);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 20px rgba(255,215,0,0.12))}
        .art-stroke.white{color:rgba(255,255,255,0.06);font-size:min(8vw,36px)}
        .art-btn{margin-top:24px;padding:14px 48px;border:none;border-radius:60px;background:linear-gradient(135deg,#f5a0b0,#e88090);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;box-shadow:0 6px 30px rgba(232,128,144,0.2)}
        .art-btn:active{transform:scale(.94)}

        @media(max-width:420px){.card{padding:24px 16px;max-width:100%}.big-heart{font-size:44px}.question{font-size:20px}.btn{padding:12px 20px;font-size:16px;min-width:80px}.bless{font-size:13px;padding:8px 16px}.popup-content{padding:28px 20px}.name-box{padding:28px 20px}.poem-box{padding:28px 20px}.poem-text{font-size:15px}.auth-box{padding:32px 24px}.auth-title{font-size:19px}.art-canvas-wrap{padding:16px 12px}.art-stroke{font-size:min(12vw,32px)}}
        @media(max-width:370px){.card{padding:20px 12px}.big-heart{font-size:36px}.question{font-size:18px}.btn{padding:10px 16px;font-size:14px;min-width:70px}.bless{font-size:11px;padding:6px 12px}.poem-text{font-size:14px}.auth-box{padding:26px 18px}.auth-title{font-size:17px}.art-stroke{font-size:min(10vw,26px)}}
    </style>
</head>
<body>

    <!-- ===== 第一阶段 ===== -->
    <div class="card" id="stage1">
        <div class="big-heart" id="bigHeart">❤️</div>
        <div class="question" id="questionEl">你爱我吗？</div>
        <div class="hint" id="hintEl">💖 认真回答哦 💖</div>
        <div class="btn-group">
            <button class="btn btn-love" id="btnLove">爱你 💕</button>
            <button class="btn btn-hate" id="btnHate">不爱 😢</button>
        </div>
        <div class="result" id="resultMsg"></div>
        <div class="love-verse" id="verse1">✦ 我们的故事还要继续，<span class="highlight">先不要退出</span> ✦</div>
    </div>

    <!-- ===== 第二阶段 ===== -->
    <div class="card card-stage2" id="stage2">
        <div class="big-heart" id="bigHeart2">💕</div>
        <div class="question" id="questionEl2">你愿意继续往下看吗？</div>
        <div class="hint" id="hintEl2">🌹 后面有惊喜哦 🌹</div>
        <div class="btn-group">
            <button class="btn btn-primary" id="btnYes">愿意 ❤️</button>
            <button class="btn btn-hate" id="btnNo">不愿意 😢</button>
        </div>
        <div class="result" id="resultMsg2"></div>
        <div class="love-verse" id="verse2">✦ 每一步都是 <span class="highlight">爱的印记</span>，别走开 ✦</div>
    </div>

    <!-- ===== 第三阶段 ===== -->
    <div class="card card-stage3" id="stage3">
        <div class="big-heart" id="bigHeart3">💕</div>
        <div class="question" id="questionEl3">点击每条祝福语 💫</div>
        <div class="hint" id="hintEl3">每条都藏着我想对你说的话 🌸</div>
        <div class="result" id="resultMsg3"></div>
        <button class="btn btn-gold" id="btnNext" style="display:none;margin-top:20px;">继续 💕</button>
    </div>

    <div id="popup">
        <div class="popup-content">
            <div class="popup-title" id="popupTitle">💕</div>
            <div class="popup-body" id="popupBody"></div>
            <button class="popup-close" onclick="closePopup()">我知道了 💕</button>
        </div>
    </div>

    <div id="nameInput">
        <div class="name-box">
            <h2 id="nameTitle">✍️ 写出你的名字</h2>
            <p class="sub-hint" id="nameSub">用手指在下方写下你的名字，我会把它变成一首诗</p>
            <input type="text" id="nameField" placeholder="输入你的名字..." maxlength="10">
            <div class="btn-group">
                <button class="btn btn-gold" id="nameConfirm">✨ 生成小诗</button>
            </div>
        </div>
    </div>

    <div id="poemDisplay">
        <div class="poem-box">
            <h2 id="poemTitle">🌹 给独一无二的你</h2>
            <p class="sub" id="poemSub">—— 你的名字，是我写过最美的诗 ——</p>
            <div class="poem-divider"></div>
            <div class="poem-text" id="poemText"></div>
            <button class="btn btn-gold" id="poemNext">继续 💕</button>
        </div>
    </div>

    <!-- ===== 笔画融合艺术画 ===== -->
    <div class="art-overlay" id="artOverlay">
        <div class="art-box">
            <div class="art-title">✦ 两个名字，一笔一画，融成一幅画 ✦</div>
            <div class="art-canvas-wrap" id="artCanvas"></div>
            <button class="art-btn" id="artBtn">💕 继续</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  统一授权码
        // ============================================================
        const SECRET_KEY = 'ROSE2026';

        function isAuthorized() {
            return localStorage.getItem('azy_romantic_auth') === 'true';
        }

        function showAuthDialog() {
            return new Promise((resolve) => {
                const overlay = document.createElement('div');
                overlay.className = 'auth-overlay';
                overlay.innerHTML = `
                        <div class="auth-box">
                            <span class="auth-icon">💌</span>
                            <h2 class="auth-title">你收到了一封来自星星的信件</h2>
                            <p class="auth-desc">轻轻输入星星告诉我的秘密口令，<br>就可以打开这扇通往星海的门 ✨</p>
                            <p class="auth-secret">✦ 口令藏在每一朵玫瑰的花蕊里 ✦</p>
                            <input type="text" class="auth-input" id="authKeyInput" placeholder="请输入秘密口令..." autofocus>
                            <div class="auth-btn-group">
                                <button class="auth-btn auth-btn-primary" id="authSubmitBtn">✨ 开启星门</button>
                                <button class="auth-btn auth-btn-secondary" id="authDemoBtn">🌙 先看星星的倒影</button>
                            </div>
                            <p class="auth-footer">✦ 口令正确，星星为你点亮 ✦</p>
                        </div>
                    `;
                document.body.appendChild(overlay);

                const input = overlay.querySelector('#authKeyInput');
                const submitBtn = overlay.querySelector('#authSubmitBtn');
                const demoBtn = overlay.querySelector('#authDemoBtn');

                setTimeout(() => input.focus(), 400);

                function validateKey() {
                    const val = input.value.trim().toUpperCase();
                    if (val === SECRET_KEY) {
                        localStorage.setItem('azy_romantic_auth', 'true');
                        overlay.innerHTML = `
                                <div class="auth-box" style="animation:floatUpAuth 0.6s cubic-bezier(0.34,1.56,0.64,1);">
                                    <span class="auth-icon" style="font-size:60px;">🌟</span>
                                    <h2 class="auth-title" style="color:#d47a8a;">✨ 星门已开启 ✨</h2>
                                    <p style="font-size:16px;color:rgba(90,61,42,0.7);line-height:1.8;margin-bottom:20px;">✨ 口令正确！星星为你点亮 🌟</p>
                                    <button class="auth-btn auth-btn-primary" id="authEnterBtn" style="padding:14px 50px;">💕 进入星海</button>
                                </div>
                            `;
                        overlay.querySelector('#authEnterBtn').onclick = function() {
                            overlay.remove();
                            resolve(true);
                        };
                    } else {
                        input.style.borderColor = '#ff6b6b';
                        input.style.animation = 'shakeAuth 0.4s ease';
                        input.value = '';
                        input.placeholder = '🌙 口令不对哦，再试一次 💫';
                        setTimeout(() => {
                            input.style.borderColor = 'rgba(212,168,106,0.2)';
                            input.style.animation = '';
                            input.placeholder = '请输入秘密口令...';
                            input.focus();
                        }, 1200);
                    }
                }

                submitBtn.onclick = validateKey;
                input.onkeydown = function(e) {
                    if (e.key === 'Enter') validateKey();
                };

                demoBtn.onclick = function() {
                    overlay.remove();
                    resolve(false);
                };
            });
        }

        async function startApp() {
            if (isAuthorized()) {
                document.getElementById('stage1').style.display = 'block';
                return;
            }
            const result = await showAuthDialog();
            if (result) {
                document.getElementById('stage1').style.display = 'block';
            } else {
                document.getElementById('stage1').style.display = 'block';
                setTimeout(() => {
                    const banner = document.createElement('div');
                    banner.style.cssText =
                        'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99998;background:linear-gradient(135deg,rgba(255,107,129,0.92),rgba(238,90,111,0.92));color:#fff;padding:12px 24px;border-radius:60px;font-size:14px;font-weight:500;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.2);box-shadow:0 10px 40px rgba(255,107,129,0.3);cursor:pointer;transition:all .3s;text-align:center;max-width:90%;';
                    banner.innerHTML =
                        '🌷 星星的倒影 · <span style="text-decoration:underline;font-weight:600;">点击输入口令解锁完整星海</span>';
                    banner.onclick = function() {
                        localStorage.removeItem('azy_romantic_auth');
                        location.reload();
                    };
                    document.body.appendChild(banner);
                }, 600);
            }
        }

        startApp();

        // ============================================================
        //  完整互动逻辑
        // ============================================================

        const blessingData = [{
            icon: '✨',
            title: '愿所有美好都如期而至',
            text: '遇见你之后，我才真正明白这句话的意义。\n\n你像晨光一样温柔地照进我的生活，让每一个平凡的日子都变得闪闪发光。\n\n美好不必远求，你就在我身边，这就是最好的如期而至。'
        }, {

        function generatePoem(name, title) {
            if (!name || name.trim() === '') return '请先输入你的名字哦 💕';
            const chars = name.trim().split('');
            const lines = [];
            chars.forEach((char) => {
                if (wordMap[char]) {
                    const options = wordMap[char];
                    lines.push(options[Math.floor(Math.random() * options.length)]);
                }
            });
            while (lines.length < 3) {
                lines.push(romanticLines[Math.floor(Math.random() * romanticLines.length)]);
            }
            const finalLines = [];
            finalLines.push('✦ ' + title + ' ✦');
            finalLines.push('');
            shuffleArray(lines).forEach(line => { finalLines.push(line); });
            finalLines.push('');
            finalLines.push('—— 你的名字，是我写过最美的诗 ——');
            return finalLines.join('\n');
        }

        function showArt(name1, name2) {
            return new Promise((resolve) => {
                const overlay = document.getElementById('artOverlay');
                const canvas = document.getElementById('artCanvas');
                const btn = document.getElementById('artBtn');

                canvas.innerHTML = '';

                const chars1 = name1.trim().split('');
                const chars2 = name2.trim().split('');

                const strokes = [];
                const maxLen = Math.max(chars1.length, chars2.length);

                for (let i = 0; i < maxLen; i++) {
                    if (i < chars1.length) {
                        strokes.push({ char: chars1[i], type: 'pink', delay: strokes.length * 120 });
                    }
                    if (i < chars2.length) {
                        strokes.push({ char: chars2[i], type: 'gold', delay: strokes.length * 120 });
                    }
                }

                shuffleArray(strokes);

                const midIndex = Math.floor(strokes.length / 2);
                strokes.splice(midIndex, 0, { char: '✦', type: 'white', delay: strokes.length * 120 });

                strokes.forEach((item) => {
                    const span = document.createElement('span');
                    span.className = 'art-stroke ' + item.type;
                    span.textContent = item.char;
                    span.style.transitionDelay = item.delay + 'ms';
                    canvas.appendChild(span);

                    setTimeout(() => {
                        span.classList.add('show');
                    }, 200 + item.delay);
                });

                overlay.classList.add('show');

                btn.onclick = function() {
                    overlay.classList.remove('show');
                    resolve();
                };
            });
        }

        function shuffleArraySimple(arr) {
            for (let i = arr.length - 1; i > 0; i--) {

        for (let row = 0; row < 6; row++) {
            positions.push({ left: 3 + (Math.random() - 0.5) * 6, top: 10 + row * 14 + (Math.random() - 0.5) * 3 });

        }
        shuffleArraySimple(positions);

        function createBless() {
            if (totalBlessCreated >= TOTAL_BLESS || blessIndex >= shuffledData.length) return;
            const pos = positions[totalBlessCreated];
            const data = shuffledData[blessIndex];
            blessIndex++;
            totalBlessCreated++;

            const el = document.createElement('div');
            el.className = 'bless';
            el.textContent = data.icon + ' ' + data.title;
            el.style.left = Math.max(2, Math.min(55, pos.left)) + 'vw';

            el.style.transform = `scale(${scale})`;
            const duration = 10 + Math.random() * 4;

            el.addEventListener('click', function() {

                el.style.opacity = '0.5';

            el.addEventListener('touchstart', function() {
                el.style.transform = `scale(${scale * 0.95})`;
            });
            el.addEventListener('touchend', function() {
                el.style.transform = `scale(${scale})`;
            });

            document.body.appendChild(el);
            activeBlessElements.push(el);

            setTimeout(() => {
                if (el.parentNode) {
                    el.parentNode.removeChild(el);
                    const idx = activeBlessElements.indexOf(el);

                    document.getElementById('stage3').style.display = 'block';
                    document.getElementById('stage3').classList.remove('hide');
                    document.getElementById('resultMsg3').innerHTML = '💕 点击下方按钮继续 💕';
                    document.getElementById('btnNext').style.display = 'inline-block';
                }
            }, 3000);
        }

        // ============================================================
        //  第三阶段：继续 → 名字输入流程
        // ============================================================
        const btnNext = document.getElementById('btnNext');
        let myName = '';
        let loverName = '';

        btnNext.addEventListener('click', function() {
            activeBlessElements.forEach(el => { if (el.parentNode) el.parentNode.removeChild(el); });
            activeBlessElements = [];
            if (replenishInterval) clearInterval(replenishInterval);

            document.getElementById('stage3').classList.add('hide');
            document.getElementById('stage3').style.display = 'none';

            showNameInput(
                '✍️ 写出你的名字',
                '用手指在下方写下你的名字，我会把它变成一首诗 💕',
                'nameField',
                function(name) {
                    if (name.trim() === '') { alert('请输入你的名字哦 💕'); return; }
                    myName = name.trim();
                    const poem = generatePoem(myName, '给独一无二的你');
                    showPoemDisplay(
                        '🌹 给独一无二的你',
                        '—— 你的名字，是我写过最美的诗 ——',
                        poem,
                        function() {
                            showNameInput(
                                '✍️ 写出你喜欢的人的名字',
                                '写下 ta 的名字，ta 也会变成一首诗 🌹',
                                'nameField',
                                function(name2) {
                                    if (name2.trim() === '') { alert('请输入 ta 的名字哦 💕'); return; }
                                    loverName = name2.trim();
                                    const poem2 = generatePoem(loverName, '给最特别的你');
                                    showPoemDisplay(
                                        '🌹 给最特别的你',
                                        '—— ' + loverName + '，你也是我写过最美的诗 ——',
                                        poem2,
                                        async function() {
                                            // 展示笔画融合艺术画
                                            await showArt(myName, loverName);

                                            // 算命名报告 + 结尾
                                            const report = generateFortuneReport(myName, loverName);
                                            const ending = [
                                                '', '', '💕 今天的故事在这里告一段落 💕', '',
                                                '但你们的故事，才刚刚开始。', '',
                                                '愿岁月温柔，愿深情不负，',
                                                '愿每一次回眸，都有彼此在灯火阑珊处。', '',
                                                '✨ 山水万程，皆有好运。✨',
                                                '💫 人间烟火，皆是温柔。💫', '',
                                                '—— 愿所有美好，都与你们环环相扣 ——'
                                            ];
                                            const fullText = report + '\n\n' + ending.join('\n');
                                            showPoemDisplay(
                                                '💕 命 名 吉 祥 笺 · 上上签 💕',
                                                '—— ' + myName + ' ✦ ' + loverName + ' —— 缘定今生',
                                                fullText,
                                                function() {
                                                    showFinalMessage();
                                                }
                                            );
                                        }
                                    );
                                }
                            );
                        }
                    );
                }
            );
        });

        // ============================================================
        //  名字输入
        // ============================================================
        let nameCallback = null;

        function showNameInput(title, sub, fieldId, callback) {
            const container = document.getElementById('nameInput');
            document.getElementById('nameTitle').textContent = title;
            document.getElementById('nameSub').textContent = sub;
            const input = document.getElementById(fieldId);
            input.value = '';
            setTimeout(() => input.focus(), 300);
            container.classList.add('show');
            nameCallback = callback;

            const confirmBtn = document.getElementById('nameConfirm');
            const newBtn = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newBtn, confirmBtn);
            newBtn.addEventListener('click', function() {
                const val = input.value.trim();
                if (val) {
                    container.classList.remove('show');
                    if (nameCallback) nameCallback(val);
                } else {
                    alert('请输入名字哦 💕');
                }
            });
            input.onkeydown = function(e) {
                if (e.key === 'Enter') {
                    newBtn.click();
                }
            };
        }

        // ============================================================
        //  小诗展示
        // ============================================================
        let poemCallback = null;

        function showPoemDisplay(title, sub, text, callback) {
            const container = document.getElementById('poemDisplay');
            document.getElementById('poemTitle').textContent = title;
            document.getElementById('poemSub').textContent = sub;
            document.getElementById('poemText').textContent = text;
            container.classList.add('show');
            poemCallback = callback;

            const nextBtn = document.getElementById('poemNext');
            const newBtn = nextBtn.cloneNode(true);
            nextBtn.parentNode.replaceChild(newBtn, nextBtn);
            newBtn.textContent = '继续 💕';
            newBtn.addEventListener('click', function() {
                container.classList.remove('show');
                if (poemCallback) poemCallback();
            });
        }

        // ============================================================
        //  最终完成
        // ============================================================
        function showFinalMessage() {
            const card = document.createElement('div');
            card.style.cssText =
                'position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:9996;display:flex;justify-content:center;align-items:center;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);';
            card.innerHTML = `
                    <div style="background:linear-gradient(145deg,#fff5f0,#fce8e0,#f5d8d0);border-radius:40px;padding:40px 30px;max-width:420px;width:90%;text-align:center;border:2px solid #d4a86a;box-shadow:0 30px 80px rgba(0,0,0,.3);">
                        <div style="font-size:72px;margin-bottom:16px;">💕</div>
                        <h2 style="font-size:24px;color:#5a3d2a;margin-bottom:8px;">故事还在继续</h2>
                        <p style="font-size:16px;color:rgba(90,61,42,.6);line-height:1.8;margin-bottom:20px;">
                            <strong style="color:#d47a8a;">${myName}</strong> 和 <strong style="color:#d47a8a;">${loverName}</strong><br>
                            两个名字，已经写进了同一个故事里。<br>
                            每一笔都是心动，每一划都是温柔。<br>
                            <span style="color:#d47a8a;font-weight:600;">愿所有的美好，都与你们环环相扣。</span>
                        </p>
                        <button onclick="this.parentElement.parentElement.remove()" style="padding:14px 40px;border:none;border-radius:60px;background:linear-gradient(135deg,#f5a0b0,#e88090);color:#fff;font-size:18px;font-weight:600;cursor:pointer;transition:all .2s;">
                            💕 我会永远记得
                        </button>
                    </div>
                `;
            document.body.appendChild(card);
            card.addEventListener('click', function(e) {
                if (e.target === this) this.remove();
            });
        }

        console.log('💕 完整旅程已加载！');
        console.log('🗝️ 统一授权码：' + SECRET_KEY);
    </script>

</body>
</html>
