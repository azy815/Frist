<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>你爱我吗 💕</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== 页面主体 ===== */
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
            padding: 20px;
            /* 🌈 渐变背景 + 慢速动画 */
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1, #fbc2eb);
            background-size: 400% 400%;
            animation: bgShift 20s ease infinite;
        }

        /* ===== 背景流动动画 ===== */
        @keyframes bgShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===== 卡片 ===== */
        .card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px 28px;
            border-radius: 48px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.12);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.3s;
        }

        /* ===== 大爱心 ===== */
        .big-heart {
            font-size: 64px;
            line-height: 1.2;
            animation: pulse 1.6s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        /* ===== 问题文字 ===== */
        .question {
            font-size: 28px;
            font-weight: 700;
            color: #4a2a33;
            margin: 12px 0 6px;
            letter-spacing: 1px;
        }

        /* ===== 小提示 ===== */
        .hint {
            color: #6b4a57;
            font-size: 15px;
            margin-bottom: 24px;
            opacity: 0.8;
            font-weight: 500;
        }

        /* ===== 按钮容器 ===== */
        .btn-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* ===== 通用按钮 ===== */
        .btn {
            padding: 16px 40px;
            border: none;
            border-radius: 60px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            flex: 0 1 auto;
            min-width: 120px;
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== "爱你" 按钮 ===== */
        .btn-love {
            background: #ff6b81;
            color: #fff;
        }
        .btn-love:active {
            transform: scale(0.94);
            box-shadow: 0 4px 12px rgba(255, 107, 129, 0.4);
        }

        /* ===== "不爱" 按钮 ===== */
        .btn-hate {
            background: #e8e0e0;
            color: #6b5a5a;
        }
        .btn-hate:active {
            transform: scale(0.94);
            background: #d5cccc;
        }

        /* ===== 结果文字 ===== */
        .result {
            margin-top: 22px;
            font-size: 20px;
            font-weight: 600;
            color: #4a2a33;
            min-height: 48px;
            transition: all 0.3s;
        }

        /* ===== 飘浮爱心 ===== */
        .float-heart {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-size: 28px;
            animation: floatUp 2s ease-out forwards;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-280px) scale(1.6) rotate(30deg);
            }
        }

        /* ===== 响应式：小屏手机 ===== */
        @media (max-width: 480px) {
            .card {
                padding: 32px 20px;
                border-radius: 36px;
            }
            .big-heart {
                font-size: 50px;
            }
            .question {
                font-size: 24px;
            }
            .btn {
                padding: 14px 28px;
                font-size: 18px;
                min-width: 100px;
            }
            .result {
                font-size: 18px;
                min-height: 40px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="big-heart" id="bigHeart">❤️</div>
        <div class="question" id="questionEl">你爱我吗？</div>
        <div class="hint" id="hintEl">💖 认真回答哦 💖</div>

        <div class="btn-group">
            <button class="btn btn-love" id="btnLove">爱你 💕</button>
            <button class="btn btn-hate" id="btnHate">不爱 😢</button>
        </div>

        <div class="result" id="resultMsg"></div>
    </div>

    <script>
        // ===== 数据 =====
        let hateClickCount = 0;
        const hateMsgs = [
            '你再想想？😠',
            '真的不爱吗？🥺',
            '再给你一次机会！😡',
            '呜呜呜我伤心了 💔'
        ];

        // ===== DOM 元素 =====
        const btnLove = document.getElementById('btnLove');
        const btnHate = document.getElementById('btnHate');
        const resultMsg = document.getElementById('resultMsg');
        const bigHeart = document.getElementById('bigHeart');
        const questionEl = document.getElementById('questionEl');
        const hintEl = document.getElementById('hintEl');

        // ===== 爱你 =====
        btnLove.addEventListener('click', function() {
            resultMsg.innerHTML = '💕 我也爱你！永远在一起！ 💕';
            resultMsg.style.color = '#c0392b';
            bigHeart.textContent = '💕';
            questionEl.textContent = '我就知道！';
            hintEl.textContent = '从今天开始，你是我的全世界！🌍';
            btnHate.style.display = 'none';
            btnLove.disabled = true;
            btnLove.style.opacity = '0.7';
            btnLove.style.cursor = 'default';
            launchHearts(24);
        });

        // ===== 不爱（带追踪 & 最后反转） =====
        btnHate.addEventListener('click', function() {
            hateClickCount++;
            const index = (hateClickCount - 1) % hateMsgs.length;
            resultMsg.innerHTML = hateMsgs[index];
            resultMsg.style.color = '#7f8c8d';

            // 心跳反应
            bigHeart.textContent = '💔';
            setTimeout(() => {
                bigHeart.textContent = '❤️';
            }, 400);

            // 按够 4 次后"变心"
            if (hateClickCount >= 4) {
                btnHate.textContent = '我错了！爱！❤️';
                btnHate.style.background = '#ff6b81';
                btnHate.style.color = '#fff';
                btnHate.style.boxShadow = '0 6px 20px rgba(255,107,129,0.3)';
                // 替换点击事件
                btnHate.onclick = function() {
                    btnLove.click();
                };
            }
        });

        // ===== 放烟花爱心 =====
        function launchHearts(count) {
            const emojis = ['❤️', '💕', '💖', '✨', '💗', '🌸'];
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.className = 'float-heart';
                    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    el.style.left = (10 + Math.random() * 80) + 'vw';
                    el.style.top = (10 + Math.random() * 80) + 'vh';
                    el.style.fontSize = (22 + Math.random() * 28) + 'px';
                    el.style.animationDuration = (1.8 + Math.random() * 1.2) + 's';
                    document.body.appendChild(el);
                    // 自动移除
                    setTimeout(() => el.remove(), 3000);
                }, i * 70);
            }
        }

        // ===== 页面加载完成后自动适配 =====
        console.log('💕 你爱我吗？页面已加载！');
    </script>

</body>
</html>
