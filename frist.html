<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>你爱我吗 💕 粉金玫瑰</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            min-height: 100vh;
            overflow: hidden;
            background: #0a0a1a;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            padding: 16px;
            background: linear-gradient(135deg, #0a0a1a, #1a0a2e, #0d1b2a, #1a0a2e);
            background-size: 400% 400%;
            animation: bgShift 30s ease infinite;
            overflow: hidden;
            position: relative;
        }
        @keyframes bgShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .card {
            position: relative;
            z-index: 20;
            background: rgba(255, 182, 193, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 32px 20px;
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 0 80px rgba(255, 182, 193, 0.05);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255, 182, 193, 0.2);
            margin: 0 auto;
        }
        .big-heart {
            font-size: 56px;
            animation: pulse 1.6s ease-in-out infinite;
            display: inline-block;
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
        }
        .question {
            font-size: 24px;
            font-weight: 700;
            color: #fce4ec;
            margin: 10px 0 4px;
            text-shadow: 0 0 30px rgba(255, 150, 200, 0.3);
        }
        .hint {
            color: rgba(255, 200, 210, 0.7);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .love-verse {
            color: rgba(255, 200, 210, 0.6);
            font-size: 13px;
            font-weight: 300;
            letter-spacing: 2px;
            margin-top: 14px;
            border-top: 1px solid rgba(255, 182, 193, 0.12);
            padding-top: 14px;
            font-style: italic;
            transition: all 0.5s ease;
            line-height: 1.6;
        }
        .love-verse .highlight {
            color: #ffb6c1;
            font-weight: 500;
            text-shadow: 0 0 20px rgba(255, 150, 200, 0.2);
        }
        .love-verse.glow {
            color: rgba(255, 200, 210, 0.9);
            text-shadow: 0 0 30px rgba(255, 150, 200, 0.2);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 60px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            min-width: 100px;
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active {
            transform: scale(0.94);
        }
        .btn-love {
            background: linear-gradient(135deg, #ff6b81, #ee5a6f);
            color: #fff;
            box-shadow: 0 6px 30px rgba(255, 107, 129, 0.3);
        }
        .btn-hate {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .btn-primary {
            background: linear-gradient(135deg, #f8a5b8, #f07a9a);
            color: #fff;
            box-shadow: 0 6px 30px rgba(240, 122, 154, 0.3);
        }
        .result {
            margin-top: 18px;
            font-size: 18px;
            font-weight: 600;
            color: #fce4ec;
            min-height: 44px;
        }
        .card-stage2 {
            display: none;
        }
        .card-stage2.active {
            display: block;
        }

        /* ===== 祝福语 ===== */
        .bless {
            position: fixed;
            pointer-events: none;
            z-index: 10;
            font-size: 16px;
            font-weight: 600;
            color: #fce4ec;
            padding: 8px 18px;
            border-radius: 32px;
            background: rgba(255, 182, 193, 0.08);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 182, 193, 0.12);
            white-space: nowrap;
            animation: floatBless linear forwards;
            opacity: 0;
            text-shadow: 0 0 20px rgba(255, 150, 200, 0.1);
        }
        @keyframes floatBless {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.85);
            }
            10% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            85% {
                opacity: 1;
                transform: translateY(-120px) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-200px) scale(0.9);
            }
        }

        /* ===== 星尘粒子 ===== */
        .stardust {
            position: fixed;
            pointer-events: none;
            z-index: 15;
            border-radius: 50%;
            opacity: 0;
            will-change: transform, opacity, left, top;
            transition: none;
        }

        /* ===== 玫瑰容器 ===== */
        #roseContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
        }
        #roseContainer.active {
            display: flex;
        }

        /* ===== 玫瑰包装 ===== */
        #roseWrapper {
            position: relative;
            width: 60vmin;
            height: 60vmin;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }
        #roseWrapper.zoomed {
            transform: scale(1.4);
        }

        /* ===== 花瓣（粉金渐变） ===== */
        .petal {
            position: absolute;
            border-radius: 50% 50% 50% 0;
            transform-origin: bottom center;
            opacity: 0;
        }
        .petal.pink-gold {
            background: radial-gradient(ellipse at 30% 30%, #ffd1b3, #ff8a80, #d44a7a);
            box-shadow: 0 0 30px rgba(255, 180, 130, 0.4), 0 0 60px rgba(255, 200, 150, 0.15);
            border: 1px solid rgba(255, 215, 180, 0.25);
        }
        .petal.pink-gold-light {
            background: radial-gradient(ellipse at 30% 30%, #ffe0c8, #ffb09a, #e85a8a);
            box-shadow: 0 0 25px rgba(255, 190, 150, 0.3), 0 0 50px rgba(255, 200, 150, 0.1);
            border: 1px solid rgba(255, 220, 190, 0.2);
        }
        .petal.pink-gold-dark {
            background: radial-gradient(ellipse at 30% 30%, #f0b8a0, #d4707a, #b03060);
            box-shadow: 0 0 35px rgba(200, 120, 100, 0.4), 0 0 60px rgba(200, 150, 100, 0.15);
            border: 1px solid rgba(200, 160, 140, 0.2);
        }
        .petal.gold {
            background: radial-gradient(ellipse at 30% 30%, #ffd700, #f0a030, #c07020);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.35);
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        .petal.green {
            background: radial-gradient(ellipse at 30% 30%, #7ddfa0, #3da86a, #1a7a40);
            box-shadow: 0 0 20px rgba(60, 200, 120, 0.3);
            border: 1px solid rgba(100, 220, 150, 0.15);
        }
        .petal.green-light {
            background: radial-gradient(ellipse at 30% 30%, #a8f0c0, #5ccf8a, #2a9a5a);
            box-shadow: 0 0 15px rgba(100, 220, 150, 0.2);
            border: 1px solid rgba(150, 240, 180, 0.12);
        }

        /* ===== 星星光环 ===== */
        .halo-star {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: orbitStar linear infinite;
            box-shadow: 0 0 15px currentColor;
        }
        @keyframes orbitStar {
            0% {
                transform: rotate(0deg) translateX(var(--radius)) rotate(0deg);
                opacity: 0.3;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: rotate(360deg) translateX(var(--radius)) rotate(-360deg);
                opacity: 0.3;
            }
        }

        /* ===== 飘落花瓣 ===== */
        .falling-petal {
            position: fixed;
            pointer-events: none;
            z-index: 5;
            border-radius: 50% 0 50% 50%;
            opacity: 0;
            animation: fallDown linear forwards;
        }
        @keyframes fallDown {
            0% {
                opacity: 0.8;
                transform: translateY(-10vh) rotate(0deg) scale(0.6);
            }
            100% {
                opacity: 0;
                transform: translateY(110vh) rotate(720deg) scale(1);
            }
        }

        /* ===== 亮粒子 ===== */
        .sparkle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: sparklePulse 1.5s ease-in-out infinite alternate;
        }
        @keyframes sparklePulse {
            0% {
                opacity: 0.3;
                transform: scale(0.5);
            }
            100% {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        /* ===== 手机适配 ===== */
        @media (max-width: 420px) {
            .card {
                padding: 24px 16px;
                max-width: 100%;
            }
            .big-heart {
                font-size: 44px;
            }
            .question {
                font-size: 20px;
            }
            .btn {
                padding: 12px 20px;
                font-size: 16px;
                min-width: 80px;
            }
            .bless {
                font-size: 13px;
                padding: 6px 12px;
            }
            .love-verse {
                font-size: 12px;
                letter-spacing: 1px;
            }
            #roseWrapper {
                width: 80vmin;
                height: 80vmin;
            }
        }
        @media (max-width: 370px) {
            .card {
                padding: 20px 12px;
            }
            .big-heart {
                font-size: 36px;
            }
            .question {
                font-size: 18px;
            }
            .btn {
                padding: 10px 16px;
                font-size: 14px;
                min-width: 70px;
            }
            .bless {
                font-size: 11px;
                padding: 5px 10px;
            }
            .love-verse {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 第一阶段 ===== -->
    <div class="card" id="stage1">
        <div class="big-heart" id="bigHeart">❤️</div>
        <div class="question" id="questionEl">你爱我吗？</div>
        <div class="hint" id="hintEl">💖 认真回答哦 💖</div>
        <div class="btn-group">
            <button class="btn btn-love" id="btnLove">爱你 💕</button>
            <button class="btn btn-hate" id="btnHate">不爱 😢</button>
        </div>
        <div class="result" id="resultMsg"></div>
        <div class="love-verse" id="verse1">
            ✦ 我们的故事还要继续，<span class="highlight">先不要退出</span> ✦
        </div>
    </div>

    <!-- ===== 第二阶段 ===== -->
    <div class="card card-stage2" id="stage2">
        <div class="big-heart" id="bigHeart2">💕</div>
        <div class="question" id="questionEl2">你愿意继续往下看吗？</div>
        <div class="hint" id="hintEl2">🌹 后面有惊喜哦 🌹</div>
        <div class="btn-group">
            <button class="btn btn-primary" id="btnYes">愿意 ❤️</button>
            <button class="btn btn-hate" id="btnNo">不愿意 😢</button>
        </div>
        <div class="result" id="resultMsg2"></div>
        <div class="love-verse" id="verse2">
            ✦ 每一步都是 <span class="highlight">爱的印记</span>，别走开 ✦
        </div>
    </div>

    <!-- ===== 玫瑰容器 ===== -->
    <div id="roseContainer">
        <div id="roseWrapper"></div>
    </div>

    <script>
        // ============================================================
        //  第一阶段：你爱我吗？
        // ============================================================
        const btnLove = document.getElementById('btnLove');
        const btnHate = document.getElementById('btnHate');
        const resultMsg = document.getElementById('resultMsg');
        const bigHeart = document.getElementById('bigHeart');
        const questionEl = document.getElementById('questionEl');
        const hintEl = document.getElementById('hintEl');
        const verse1 = document.getElementById('verse1');
        const stage1 = document.getElementById('stage1');
        const stage2 = document.getElementById('stage2');

        let hateClickCount = 0;
        const hateMsgs = ['你再想想？😠', '真的不爱吗？🥺', '再给你一次机会！😡', '呜呜呜我伤心了 💔'];

        function launchHearts(count) {
            const emojis = ['❤️', '💕', '💖', '✨', '💗', '🌸'];
            return new Promise((resolve) => {
                let completed = 0;
                for (let i = 0; i < count; i++) {
                    setTimeout(() => {
                        const el = document.createElement('div');
                        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                        el.style.cssText =
                            `position:fixed;pointer-events:none;z-index:9999;font-size:${20+Math.random()*26}px;left:${10+Math.random()*80}vw;top:${10+Math.random()*80}vh;animation:floatUp ${1.8+Math.random()*1.2}s ease-out forwards;`;
                        document.body.appendChild(el);
                        setTimeout(() => el.remove(), 3000);
                        completed++;
                        if (completed === count) setTimeout(resolve, 500);
                    }, i * 70);
                }
            });
        }
        const styleHeart = document.createElement('style');
        styleHeart.textContent =
            `@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-280px) scale(1.6)}}`;
        document.head.appendChild(styleHeart);

        btnLove.addEventListener('click', async function() {
            resultMsg.innerHTML = '💕 我也爱你！永远在一起！ 💕';
            resultMsg.style.color = '#ff8eb5';
            bigHeart.textContent = '💕';
            questionEl.textContent = '我就知道！';
            hintEl.textContent = '从今天开始，你是我的全世界！🌍';
            verse1.innerHTML = '✦ 你是我 <span class="highlight">藏在微风里的喜欢</span> ✦';
            verse1.classList.add('glow');
            btnHate.style.display = 'none';
            btnLove.disabled = true;
            btnLove.style.opacity = '0.7';
            await launchHearts(28);
            stage1.style.display = 'none';
            stage2.classList.add('active');
        });

        btnHate.addEventListener('click', function() {
            hateClickCount++;
            const index = (hateClickCount - 1) % hateMsgs.length;
            resultMsg.innerHTML = hateMsgs[index];
            resultMsg.style.color = '#7f8c8d';
            bigHeart.textContent = '💔';
            setTimeout(() => { bigHeart.textContent = '❤️'; }, 400);
            if (hateClickCount >= 4) {
                btnHate.textContent = '我错了！爱！❤️';
                btnHate.style.background = 'linear-gradient(135deg,#ff6b81,#ee5a6f)';
                btnHate.style.color = '#fff';
                btnHate.onclick = function() { btnLove.click(); };
            }
        });

        // ============================================================
        //  第二阶段
        // ============================================================
        const btnYes = document.getElementById('btnYes');
        const btnNo = document.getElementById('btnNo');
        const resultMsg2 = document.getElementById('resultMsg2');
        const bigHeart2 = document.getElementById('bigHeart2');
        const questionEl2 = document.getElementById('questionEl2');
        const hintEl2 = document.getElementById('hintEl2');
        const verse2 = document.getElementById('verse2');

        let noClickCount = 0;
        const noMsgs = ['真的不想看吗？🥺', '再给你一次机会！😠', '求求你了嘛～😭', '最后问一次！💔'];

        btnYes.addEventListener('click', function() {
            resultMsg2.innerHTML = '🎉 太好了！让我们一起看下去！ 💕';
            resultMsg2.style.color = '#f8a5b8';
            bigHeart2.textContent = '🌟';
            questionEl2.textContent = '你真好！';
            hintEl2.textContent = '💫 愿所有的美好都属于你 💫';
            verse2.innerHTML = '✦ <span class="highlight">星辰大海</span> 不及你眼中光芒 ✦';
            verse2.classList.add('glow');
            btnNo.style.display = 'none';
            btnYes.disabled = true;
            btnYes.style.opacity = '0.7';
            startFullJourney();
        });

        btnNo.addEventListener('click', function() {
            noClickCount++;
            const index = (noClickCount - 1) % noMsgs.length;
            resultMsg2.innerHTML = noMsgs[index];
            resultMsg2.style.color = '#7f8c8d';
            bigHeart2.textContent = '😢';
            setTimeout(() => { bigHeart2.textContent = '💕'; }, 400);
            if (noClickCount >= 4) {
                btnNo.textContent = '我愿意！❤️';
                btnNo.style.background = 'linear-gradient(135deg,#f8a5b8,#f07a9a)';
                btnNo.style.color = '#fff';
                btnNo.onclick = function() { btnYes.click(); };
            }
        });

        // ============================================================
        //  祝福语系统
        // ============================================================
        const blessings = [
            '✨ 愿所有美好都如期而至', '🌸 你是我藏在微风里的喜欢',
            '💫 星星温柔，人间浪漫', '🌙 月光所至，万事胜意',
            '🌺 愿你眼里有光，心中有爱', '🍀 幸运常伴，笑靥如花',
            '💖 心动不止，温柔不息', '🌊 山高水长，来日方长',
            '🎈 每一天都是新的开始', '🌈 生活明朗，万物可爱',
            '🌟 你本身就是最好的礼物', '💕 爱意随风起，风止意难平'
        ];

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
        let usedBlessings = [];

        function getNextBlessing() {
            if (usedBlessings.length === 0) usedBlessings = shuffleArray([...blessings]);
            return usedBlessings.pop();
        }

        const gridCols = 3,
            gridRows = 5;
        let availableGrids = [];

        function initGrids() {
            availableGrids = [];
            for (let row = 0; row < gridRows; row++) {
                for (let col = 0; col < gridCols; col++) {
                    availableGrids.push({ row, col });
                }
            }
            availableGrids = shuffleArray(availableGrids);
        }

        function getGridPosition() {
            if (availableGrids.length === 0) initGrids();
            const grid = availableGrids.pop();
            const colWidth = 100 / gridCols,
                rowHeight = 100 / gridRows;
            let left = grid.col * colWidth + colWidth / 2 + (Math.random() - 0.5) * colWidth * 0.6;
            let top = grid.row * rowHeight + rowHeight / 2 + (Math.random() - 0.5) * rowHeight * 0.6;
            return { left: Math.max(2, Math.min(98, left)), top: Math.max(2, Math.min(98, top)) };
        }

        let activeBlessElements = [];
        const MAX_BLESS = 12;
        let blessCount = 0;
        const TOTAL_BLESS = 12;

        function createBless() {
            if (activeBlessElements.length >= MAX_BLESS || blessCount >= TOTAL_BLESS) return;
            const pos = getGridPosition();
            const el = document.createElement('div');
            el.className = 'bless';
            el.textContent = getNextBlessing();
            el.style.left = pos.left + 'vw';
            el.style.top = pos.top + 'vh';
            const scale = 0.75 + Math.random() * 0.5;
            el.style.fontSize = (13 + Math.random() * 11) + 'px';
            el.style.transform = `scale(${scale})`;
            const duration = 12 + Math.random() * 8;
            el.style.animationDuration = duration + 's';
            document.body.appendChild(el);
            activeBlessElements.push(el);
            blessCount++;
            setTimeout(() => {
                if (el.parentNode) {
                    el.parentNode.removeChild(el);
                    const idx = activeBlessElements.indexOf(el);
                    if (idx > -1) activeBlessElements.splice(idx, 1);
                }
            }, duration * 1000 + 300);
        }

        function startBlessingRain() {
            return new Promise((resolve) => {
                blessCount = 0;
                activeBlessElements = [];
                initGrids();
                for (let i = 0; i < TOTAL_BLESS; i++) {
                    setTimeout(() => createBless(), i * 600);
                }
                const checkDone = setInterval(() => {
                    if (blessCount >= TOTAL_BLESS && activeBlessElements.length === 0) {
                        clearInterval(checkDone);
                        setTimeout(resolve, 500);
                    }
                }, 500);
            });
        }

        // ============================================================
        //  C: 飘落花瓣
        // ============================================================
        let fallingInterval = null;

        function startFallingPetals() {
            if (fallingInterval) return;
            const colors = ['#ffb6c1', '#ff8a80', '#ffb09a', '#ffd1b3', '#f0a030'];
            fallingInterval = setInterval(() => {
                const count = 2 + Math.floor(Math.random() * 3);
                for (let i = 0; i < count; i++) {
                    const petal = document.createElement('div');
                    petal.className = 'falling-petal';
                    const size = 10 + Math.random() * 18;
                    petal.style.width = size + 'px';
                    petal.style.height = size * 1.4 + 'px';
                    petal.style.left = (Math.random() * 100) + 'vw';
                    petal.style.background = colors[Math.floor(Math.random() * colors.length)];
                    petal.style.boxShadow = `0 0 15px ${colors[Math.floor(Math.random() * colors.length)]}40`;
                    const duration = 8 + Math.random() * 10;
                    petal.style.animationDuration = duration + 's';
                    petal.style.animationDelay = (Math.random() * 2) + 's';
                    document.body.appendChild(petal);
                    setTimeout(() => petal.remove(), duration * 1000 + 3000);
                }
            }, 1500);
        }

        function stopFallingPetals() {
            if (fallingInterval) {
                clearInterval(fallingInterval);
                fallingInterval = null;
            }
        }

        // ============================================================
        //  星尘粒子 → 粉金玫瑰（含 B:点击放大 + D:星星光环）
        // ============================================================

        function getRosePetalData() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const cx = w / 2;
            const cy = h / 2 - 20;
            const baseSize = Math.min(w, h) * 0.28;

            const petals = [];
            const layers = [
                { count: 8, radius: 1.0, size: 1.0, type: 'pink-gold-dark' },
                { count: 10, radius: 0.85, size: 0.9, type: 'pink-gold' },
                { count: 12, radius: 0.7, size: 0.8, type: 'pink-gold-light' },
                { count: 14, radius: 0.55, size: 0.7, type: 'pink-gold' },
                { count: 16, radius: 0.4, size: 0.6, type: 'pink-gold-light' },
                { count: 18, radius: 0.25, size: 0.5, type: 'pink-gold' }
            ];

            layers.forEach((layer, li) => {
                const baseAngle = (li * 30) % 360;
                for (let i = 0; i < layer.count; i++) {
                    const angle = (i / layer.count) * 360 + baseAngle + (Math.random() - 0.5) * 15;
                    const rad = angle * Math.PI / 180;
                    const r = layer.radius * baseSize * (0.85 + Math.random() * 0.15);
                    const x = cx + r * Math.cos(rad) - 15;
                    const y = cy + r * Math.sin(rad) * 0.6 - 10;
                    const size = (22 + Math.random() * 14) * layer.size;
                    petals.push({
                        x: x,
                        y: y,
                        w: size,
                        h: size * 1.4,
                        rot: angle + 30 + (Math.random() - 0.5) * 20,
                        type: layer.type,
                        isLeaf: false
                    });
                }
            });

            const leafPositions = [
                { angle: -40, dist: 1.2, size: 1.0 },
                { angle: -20, dist: 1.25, size: 0.9 },
                { angle: 210, dist: 1.2, size: 1.0 },
                { angle: 230, dist: 1.25, size: 0.9 }
            ];
            leafPositions.forEach((lp) => {
                const rad = lp.angle * Math.PI / 180;
                const r = lp.dist * baseSize * 0.7;
                const x = cx + r * Math.cos(rad) - 10;
                const y = cy + r * Math.sin(rad) * 0.6 + 10;
                const size = (22 + Math.random() * 10) * lp.size;
                petals.push({
                    x: x,
                    y: y,
                    w: size * 1.6,
                    h: size * 1.2,
                    rot: lp.angle + 90 + (Math.random() - 0.5) * 20,
                    type: (Math.random() > 0.5) ? 'green' : 'green-light',
                    isLeaf: true
                });
            });

            return petals;
        }
