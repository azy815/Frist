<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>你爱我吗 💕 星尘玫瑰</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            min-height: 100vh;
            overflow: hidden;
            background: #0a0a1a;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            padding: 16px;
            background: linear-gradient(135deg, #0a0a1a, #1a0a2e, #0d1b2a, #1a0a2e);
            background-size: 400% 400%;
            animation: bgShift 30s ease infinite;
            overflow: hidden;
            position: relative;
        }
        @keyframes bgShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .card {
            position: relative;
            z-index: 20;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 32px 20px;
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.12);
            margin: 0 auto;
        }
        .big-heart {
            font-size: 56px;
            animation: pulse 1.6s ease-in-out infinite;
            display: inline-block;
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
        }
        .question {
            font-size: 24px;
            font-weight: 700;
            color: #f0e6ff;
            margin: 10px 0 4px;
            text-shadow: 0 0 20px rgba(255, 200, 255, 0.2);
        }
        .hint {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 20px;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 60px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            min-width: 100px;
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active {
            transform: scale(0.94);
        }
        .btn-love {
            background: linear-gradient(135deg, #ff6b81, #ee5a6f);
            color: #fff;
        }
        .btn-hate {
            background: rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-primary {
            background: linear-gradient(135deg, #a18cd1, #8b7bc8);
            color: #fff;
        }
        .result {
            margin-top: 18px;
            font-size: 18px;
            font-weight: 600;
            color: #f0e6ff;
            min-height: 44px;
        }
        .card-stage2 {
            display: none;
        }
        .card-stage2.active {
            display: block;
        }

        /* ===== 祝福语 ===== */
        .bless {
            position: fixed;
            pointer-events: none;
            z-index: 10;
            font-size: 16px;
            font-weight: 600;
            color: #f0e6ff;
            padding: 8px 18px;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            white-space: nowrap;
            animation: floatBless linear forwards;
            opacity: 0;
            text-shadow: 0 0 20px rgba(255, 200, 255, 0.15);
        }
        @keyframes floatBless {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.85);
            }
            10% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            85% {
                opacity: 1;
                transform: translateY(-120px) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-200px) scale(0.9);
            }
        }

        /* ===== 星尘粒子 ===== */
        .stardust {
            position: fixed;
            pointer-events: none;
            z-index: 15;
            border-radius: 50%;
            opacity: 0;
            will-change: transform, opacity, left, top;
            transition: none;
        }

        /* ===== 冰晶玫瑰容器 ===== */
        #roseContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            display: none;
        }
        #roseContainer.active {
            display: block;
        }

        /* ===== 花瓣 ===== */
        .petal {
            position: absolute;
            border-radius: 50% 50% 50% 0;
            transform-origin: bottom center;
            opacity: 0;
        }
        .petal.pink {
            background: radial-gradient(ellipse at 30% 30%, #ffb6d9, #ff6b9d, #d44a7a);
            box-shadow: 0 0 25px rgba(255, 100, 150, 0.4);
            border: 1px solid rgba(255, 200, 220, 0.2);
        }
        .petal.pink-light {
            background: radial-gradient(ellipse at 30% 30%, #ffd1e8, #ff8eb5, #e85a8a);
            box-shadow: 0 0 20px rgba(255, 150, 200, 0.3);
            border: 1px solid rgba(255, 200, 220, 0.15);
        }
        .petal.pink-dark {
            background: radial-gradient(ellipse at 30% 30%, #e88ab0, #d44a7a, #b03060);
            box-shadow: 0 0 30px rgba(200, 60, 120, 0.4);
            border: 1px solid rgba(200, 100, 150, 0.2);
        }
        .petal.green {
            background: radial-gradient(ellipse at 30% 30%, #7ddfa0, #3da86a, #1a7a40);
            box-shadow: 0 0 20px rgba(60, 200, 120, 0.3);
            border: 1px solid rgba(100, 220, 150, 0.15);
        }
        .petal.green-light {
            background: radial-gradient(ellipse at 30% 30%, #a8f0c0, #5ccf8a, #2a9a5a);
            box-shadow: 0 0 15px rgba(100, 220, 150, 0.2);
            border: 1px solid rgba(150, 240, 180, 0.12);
        }

        /* ===== 亮粒子 ===== */
        .sparkle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: sparklePulse 1.5s ease-in-out infinite alternate;
        }
        @keyframes sparklePulse {
            0% {
                opacity: 0.3;
                transform: scale(0.5);
            }
            100% {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        /* ===== 手机适配 ===== */
        @media (max-width: 420px) {
            .card {
                padding: 24px 16px;
                max-width: 100%;
            }
            .big-heart {
                font-size: 44px;
            }
            .question {
                font-size: 20px;
            }
            .btn {
                padding: 12px 20px;
                font-size: 16px;
                min-width: 80px;
            }
            .bless {
                font-size: 13px;
                padding: 6px 12px;
            }
        }
        @media (max-width: 370px) {
            .card {
                padding: 20px 12px;
            }
            .big-heart {
                font-size: 36px;
            }
            .question {
                font-size: 18px;
            }
            .btn {
                padding: 10px 16px;
                font-size: 14px;
                min-width: 70px;
            }
            .bless {
                font-size: 11px;
                padding: 5px 10px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 第一阶段 ===== -->
    <div class="card" id="stage1">
        <div class="big-heart" id="bigHeart">❤️</div>
        <div class="question" id="questionEl">你爱我吗？</div>
        <div class="hint" id="hintEl">💖 认真回答哦 💖</div>
        <div class="btn-group">
            <button class="btn btn-love" id="btnLove">爱你 💕</button>
            <button class="btn btn-hate" id="btnHate">不爱 😢</button>
        </div>
        <div class="result" id="resultMsg"></div>
    </div>

    <!-- ===== 第二阶段 ===== -->
    <div class="card card-stage2" id="stage2">
        <div class="big-heart" id="bigHeart2">💕</div>
        <div class="question" id="questionEl2">你愿意继续往下看吗？</div>
        <div class="hint" id="hintEl2">🌹 后面有惊喜哦 🌹</div>
        <div class="btn-group">
            <button class="btn btn-primary" id="btnYes">愿意 ❤️</button>
            <button class="btn btn-hate" id="btnNo">不愿意 😢</button>
        </div>
        <div class="result" id="resultMsg2"></div>
    </div>

    <!-- ===== 玫瑰容器 ===== -->
    <div id="roseContainer"></div>

    <script>
        // ============================================================
        //  第一阶段：你爱我吗？
        // ============================================================
        const btnLove = document.getElementById('btnLove');
        const btnHate = document.getElementById('btnHate');
        const resultMsg = document.getElementById('resultMsg');
        const bigHeart = document.getElementById('bigHeart');
        const questionEl = document.getElementById('questionEl');
        const hintEl = document.getElementById('hintEl');
        const stage1 = document.getElementById('stage1');
        const stage2 = document.getElementById('stage2');

        let hateClickCount = 0;
        const hateMsgs = ['你再想想？😠', '真的不爱吗？🥺', '再给你一次机会！😡', '呜呜呜我伤心了 💔'];

        function launchHearts(count) {
            const emojis = ['❤️', '💕', '💖', '✨', '💗', '🌸'];
            return new Promise((resolve) => {
                let completed = 0;
                for (let i = 0; i < count; i++) {
                    setTimeout(() => {
                        const el = document.createElement('div');
                        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                        el.style.cssText =
                            `position:fixed;pointer-events:none;z-index:9999;font-size:${20+Math.random()*26}px;left:${10+Math.random()*80}vw;top:${10+Math.random()*80}vh;animation:floatUp ${1.8+Math.random()*1.2}s ease-out forwards;`;
                        document.body.appendChild(el);
                        setTimeout(() => el.remove(), 3000);
                        completed++;
                        if (completed === count) setTimeout(resolve, 500);
                    }, i * 70);
                }
            });
        }
        const styleHeart = document.createElement('style');
        styleHeart.textContent =
            `@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-280px) scale(1.6)}}`;
        document.head.appendChild(styleHeart);

        btnLove.addEventListener('click', async function() {
            resultMsg.innerHTML = '💕 我也爱你！永远在一起！ 💕';
            resultMsg.style.color = '#ff8eb5';
            bigHeart.textContent = '💕';
            questionEl.textContent = '我就知道！';
            hintEl.textContent = '从今天开始，你是我的全世界！🌍';
            btnHate.style.display = 'none';
            btnLove.disabled = true;
            btnLove.style.opacity = '0.7';
            await launchHearts(28);
            stage1.style.display = 'none';
            stage2.classList.add('active');
        });

        btnHate.addEventListener('click', function() {
            hateClickCount++;
            const index = (hateClickCount - 1) % hateMsgs.length;
            resultMsg.innerHTML = hateMsgs[index];
            resultMsg.style.color = '#7f8c8d';
            bigHeart.textContent = '💔';
            setTimeout(() => { bigHeart.textContent = '❤️'; }, 400);
            if (hateClickCount >= 4) {
                btnHate.textContent = '我错了！爱！❤️';
                btnHate.style.background = 'linear-gradient(135deg,#ff6b81,#ee5a6f)';
                btnHate.style.color = '#fff';
                btnHate.onclick = function() { btnLove.click(); };
            }
        });

        // ============================================================
        //  第二阶段：愿意继续看吗？
        // ============================================================
        const btnYes = document.getElementById('btnYes');
        const btnNo = document.getElementById('btnNo');
        const resultMsg2 = document.getElementById('resultMsg2');
        const bigHeart2 = document.getElementById('bigHeart2');
        const questionEl2 = document.getElementById('questionEl2');
        const hintEl2 = document.getElementById('hintEl2');

        let noClickCount = 0;
        const noMsgs = ['真的不想看吗？🥺', '再给你一次机会！😠', '求求你了嘛～😭', '最后问一次！💔'];

        btnYes.addEventListener('click', function() {
            resultMsg2.innerHTML = '🎉 太好了！让我们一起看下去！ 💕';
            resultMsg2.style.color = '#c8b0e8';
            bigHeart2.textContent = '🌟';
            questionEl2.textContent = '你真好！';
            hintEl2.textContent = '💫 愿所有的美好都属于你 💫';
            btnNo.style.display = 'none';
            btnYes.disabled = true;
            btnYes.style.opacity = '0.7';
            startFullJourney();
        });

        btnNo.addEventListener('click', function() {
            noClickCount++;
            const index = (noClickCount - 1) % noMsgs.length;
            resultMsg2.innerHTML = noMsgs[index];
            resultMsg2.style.color = '#7f8c8d';
            bigHeart2.textContent = '😢';
            setTimeout(() => { bigHeart2.textContent = '💕'; }, 400);
            if (noClickCount >= 4) {
                btnNo.textContent = '我愿意！❤️';
                btnNo.style.background = 'linear-gradient(135deg,#a18cd1,#8b7bc8)';
                btnNo.style.color = '#fff';
                btnNo.onclick = function() { btnYes.click(); };
            }
        });

        // ============================================================
        //  祝福语系统
        // ============================================================
        const blessings = [
            '✨ 愿所有美好都如期而至', '🌸 你是我藏在微风里的喜欢',
            '💫 星星温柔，人间浪漫', '🌙 月光所至，万事胜意',
            '🌺 愿你眼里有光，心中有爱', '🍀 幸运常伴，笑靥如花',
            '💖 心动不止，温柔不息', '🌊 山高水长，来日方长',
            '🎈 每一天都是新的开始', '🌈 生活明朗，万物可爱',
            '🌟 你本身就是最好的礼物', '💕 爱意随风起，风止意难平'
        ];

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
        let usedBlessings = [];

        function getNextBlessing() {
            if (usedBlessings.length === 0) usedBlessings = shuffleArray([...blessings]);
            return usedBlessings.pop();
        }

        const gridCols = 3,
            gridRows = 5;
        let availableGrids = [];

        function initGrids() {
            availableGrids = [];
            for (let row = 0; row < gridRows; row++) {
                for (let col = 0; col < gridCols; col++) {
                    availableGrids.push({ row, col });
                }
            }
            availableGrids = shuffleArray(availableGrids);
        }

        function getGridPosition() {
            if (availableGrids.length === 0) initGrids();
            const grid = availableGrids.pop();
            const colWidth = 100 / gridCols,
                rowHeight = 100 / gridRows;
            let left = grid.col * colWidth + colWidth / 2 + (Math.random() - 0.5) * colWidth * 0.6;
            let top = grid.row * rowHeight + rowHeight / 2 + (Math.random() - 0.5) * rowHeight * 0.6;
            return { left: Math.max(2, Math.min(98, left)), top: Math.max(2, Math.min(98, top)) };
        }

        let activeBlessElements = [];
        const MAX_BLESS = 12;
        let blessCount = 0;
        const TOTAL_BLESS = 12;

        function createBless() {
            if (activeBlessElements.length >= MAX_BLESS || blessCount >= TOTAL_BLESS) return;
            const pos = getGridPosition();
            const el = document.createElement('div');
            el.className = 'bless';
            el.textContent = getNextBlessing();
            el.style.left = pos.left + 'vw';
            el.style.top = pos.top + 'vh';
            const scale = 0.75 + Math.random() * 0.5;
            el.style.fontSize = (13 + Math.random() * 11) + 'px';
            el.style.transform = `scale(${scale})`;
            const duration = 12 + Math.random() * 8;
            el.style.animationDuration = duration + 's';
            document.body.appendChild(el);
            activeBlessElements.push(el);
            blessCount++;
            setTimeout(() => {
                if (el.parentNode) {
                    el.parentNode.removeChild(el);
                    const idx = activeBlessElements.indexOf(el);
                    if (idx > -1) activeBlessElements.splice(idx, 1);
                }
            }, duration * 1000 + 300);
        }

        function startBlessingRain() {
            return new Promise((resolve) => {
                blessCount = 0;
                activeBlessElements = [];
                initGrids();
                for (let i = 0; i < TOTAL_BLESS; i++) {
                    setTimeout(() => createBless(), i * 600);
                }
                const checkDone = setInterval(() => {
                    if (blessCount >= TOTAL_BLESS && activeBlessElements.length === 0) {
                        clearInterval(checkDone);
                        setTimeout(resolve, 500);
                    }
                }, 500);
            });
        }

        // ============================================================
        //  星尘粒子 → 汇聚成玫瑰
        // ============================================================

        // 玫瑰花瓣数据（预计算目标位置）
        function getRosePetalData() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const cx = w / 2;
            const cy = h / 2 - 20;
            const baseSize = Math.min(w, h) * 0.28;

            const petals = [];
            const layers = [
                { count: 8, radius: 1.0, size: 1.0, type: 'pink-dark' },
                { count: 10, radius: 0.85, size: 0.9, type: 'pink' },
                { count: 12, radius: 0.7, size: 0.8, type: 'pink-light' },
                { count: 14, radius: 0.55, size: 0.7, type: 'pink' },
                { count: 16, radius: 0.4, size: 0.6, type: 'pink-light' },
                { count: 18, radius: 0.25, size: 0.5, type: 'pink' }
            ];

            layers.forEach((layer, li) => {
                const baseAngle = (li * 30) % 360;
                for (let i = 0; i < layer.count; i++) {
                    const angle = (i / layer.count) * 360 + baseAngle + (Math.random() - 0.5) * 15;
                    const rad = angle * Math.PI / 180;
                    const r = layer.radius * baseSize * (0.85 + Math.random() * 0.15);
                    const x = cx + r * Math.cos(rad) - 15;
                    const y = cy + r * Math.sin(rad) * 0.6 - 10;
                    const size = (22 + Math.random() * 14) * layer.size;
                    petals.push({
                        x: x,
                        y: y,
                        w: size,
                        h: size * 1.4,
                        rot: angle + 30 + (Math.random() - 0.5) * 20,
                        type: layer.type,
                        isLeaf: false
                    });
                }
            });

            // 叶子
            const leafPositions = [
                { angle: -40, dist: 1.2, size: 1.0 },
                { angle: -20, dist: 1.25, size: 0.9 },
                { angle: 210, dist: 1.2, size: 1.0 },
                { angle: 230, dist: 1.25, size: 0.9 }
            ];
            leafPositions.forEach((lp) => {
                const rad = lp.angle * Math.PI / 180;
                const r = lp.dist * baseSize * 0.7;
                const x = cx + r * Math.cos(rad) - 10;
                const y = cy + r * Math.sin(rad) * 0.6 + 10;
                const size = (22 + Math.random() * 10) * lp.size;
                petals.push({
                    x: x,
                    y: y,
                    w: size * 1.6,
                    h: size * 1.2,
                    rot: lp.angle + 90 + (Math.random() - 0.5) * 20,
                    type: (Math.random() > 0.5) ? 'green' : 'green-light',
                    isLeaf: true
                });
            });

            return petals;
        }

        function createStardustAndConverge() {
            return new Promise((resolve) => {
                const container = document.getElementById('roseContainer');
                container.innerHTML = '';
                container.classList.add('active');

                const petalData = getRosePetalData();
                const totalParticles = petalData.length;
                const particles = [];

                // 1. 生成星尘粒子（极细，散落在屏幕各处）
                for (let i = 0; i < totalParticles; i++) {
                    const el = document.createElement('div');
                    el.className = 'stardust';
                    const size = 2 + Math.random() * 4;
                    el.style.width = size + 'px';
                    el.style.height = size + 'px';

                    // 起始位置：屏幕随机
                    const startX = 5 + Math.random() * 90;
                    const startY = 5 + Math.random() * 90;
                    el.style.left = startX + 'vw';
                    el.style.top = startY + 'vh';

                    // 颜色：粉色或绿色系
                    const colors = ['#ffb6d9', '#ff8eb5', '#ff6b9d', '#d4a0e8', '#7ddfa0', '#a8f0c0', '#ffd700', '#ffffff'];
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    el.style.background = color;
                    el.style.boxShadow = `0 0 ${8+Math.random()*20}px ${color}`;
                    el.style.opacity = '0.8';

                    // 随机闪烁速度
                    const twinkleDur = 1 + Math.random() * 2;
                    el.style.animation = `twinkleParticle ${twinkleDur}s ease-in-out infinite alternate`;
                    el.dataset.twinkleDur = twinkleDur;

                    // 存储目标位置
                    const p = petalData[i];
                    el.dataset.targetX = p.x;
                    el.dataset.targetY = p.y;
                    el.dataset.targetW = p.w;
                    el.dataset.targetH = p.h;
                    el.dataset.targetRot = p.rot;
                    el.dataset.type = p.type;
                    el.dataset.isLeaf = p.isLeaf ? 'true' : 'false';

                    document.body.appendChild(el);
                    particles.push(el);
                }

                // 注入粒子闪烁动画
                const styleTwinkle = document.createElement('style');
                styleTwinkle.textContent =
                    `@keyframes twinkleParticle{0%{opacity:0.3;transform:scale(0.5)}100%{opacity:1;transform:scale(1.2)}}`;
                document.head.appendChild(styleTwinkle);

                // 2. 汇聚动画：从当前位置飞向目标
                setTimeout(() => {
                    particles.forEach((el, index) => {
                        setTimeout(() => {
                            const targetX = parseFloat(el.dataset.targetX);
                            const targetY = parseFloat(el.dataset.targetY);
                            const targetW = parseFloat(el.dataset.targetW);
                            const targetH = parseFloat(el.dataset.targetH);
                            const targetRot = parseFloat(el.dataset.targetRot);
                            const type = el.dataset.type;
                            const isLeaf = el.dataset.isLeaf === 'true';

                            // 飞向目标
                            el.style.transition =
                                `all ${0.8+Math.random()*0.6}s cubic-bezier(0.34, 1.56, 0.64, 1)`;
                            el.style.left = targetX + 'px';
                            el.style.top = targetY + 'px';
                            el.style.width = targetW + 'px';
                            el.style.height = targetH + 'px';
                            el.style.borderRadius = isLeaf ? '50% 0 50% 50%' : '50% 50% 50% 0';
                            el.style.transform = `rotate(${targetRot}deg)`;
                            el.style.background = getGradient(type);
                            el.style.boxShadow = getShadow(type);
                            el.style.border = '1px solid ' + getBorder(type);
                            el.style.opacity = '1';
                            el.style.animation = 'none';

                            // 到达后变成花瓣样式
                            setTimeout(() => {
                                el.className = `petal ${type}`;
                                el.style.transition = 'none';
                                el.style.left = targetX + 'px';
                                el.style.top = targetY + 'px';
                                el.style.width = targetW + 'px';
                                el.style.height = targetH + 'px';
                                el.style.borderRadius = isLeaf ? '50% 0 50% 50%' :
                                '50% 50% 50% 0';
                                el.style.transform = `rotate(${targetRot}deg)`;
                                el.style.opacity = '1';
                                el.style.animation =
                                    `petalAppear 0.6s ease-out forwards`;
                                el.style.animationDelay = '0s';
                            }, 100);
                        }, index * 25);
                    });

                    // 所有粒子到达后，添加亮粒子点缀
                    setTimeout(() => {
                        addSparkles();
                        setTimeout(resolve, 1000);
                    }, totalParticles * 25 + 1500);

                }, 800);
            });
        }

        function getGradient(type) {
            const g = {
                'pink': 'radial-gradient(ellipse at 30% 30%, #ffb6d9, #ff6b9d, #d44a7a)',
                'pink-light': 'radial-gradient(ellipse at 30% 30%, #ffd1e8, #ff8eb5, #e85a8a)',
                'pink-dark': 'radial-gradient(ellipse at 30% 30%, #e88ab0, #d44a7a, #b03060)',
                'green': 'radial-gradient(ellipse at 30% 30%, #7ddfa0, #3da86a, #1a7a40)',
                'green-light': 'radial-gradient(ellipse at 30% 30%, #a8f0c0, #5ccf8a, #2a9a5a)'
            };
            return g[type] || g['pink'];
        }

        function getShadow(type) {
            if (type.includes('pink')) return '0 0 25px rgba(255,100,150,0.4)';
            return '0 0 20px rgba(60,200,120,0.3)';
        }

        function getBorder(type) {
            if (type.includes('pink')) return 'rgba(255,200,220,0.2)';
            return 'rgba(100,220,150,0.15)';
        }

        function addSparkles() {
            const container = document.getElementById('roseContainer');
            const sparkleColors = ['#ffb6d9', '#ff8eb5', '#ff6b9d', '#ffd700', '#7ddfa0', '#a8d8ff', '#ffffff', '#ff69b4'];
            const count = 50 + Math.floor(Math.random() * 30);

            // 获取玫瑰中心
            const w = window.innerWidth;
            const h = window.innerHeight;
            const cx = w / 2;
            const cy = h / 2 - 20;
            const baseSize = Math.min(w, h) * 0.3;

            for (let i = 0; i < count; i++) {
                const sp = document.createElement('div');
                sp.className = 'sparkle';
                const size = 2 + Math.random() * 5;
                const color = sparkleColors[Math.floor(Math.random() * sparkleColors.length)];
                sp.style.width = size + 'px';
                sp.style.height = size + 'px';
                sp.style.background = color;
                sp.style.color = color;
                sp.style.boxShadow = `0 0 ${10+Math.random()*25}px ${color}`;

                const angle = Math.random() * 360;
                const rad = angle * Math.PI / 180;
                const dist = (0.1 + Math.random() * 1.5) * baseSize;
                sp.style.left = (cx + dist * Math.cos(rad) - 3) + 'px';
                sp.style.top = (cy + dist * Math.sin(rad) * 0.6 - 3) + 'px';
                sp.style.animationDelay = (Math.random() * 3) + 's';
                sp.style.animationDuration = (1 + Math.random() * 2) + 's';

                container.appendChild(sp);
            }
        }

        // 注入花瓣出现动画
        const stylePetalAppear = document.createElement('style');
        stylePetalAppear.textContent =
            `@keyframes petalAppear{0%{opacity:0;transform:scale(0) rotate(0deg)}60%{opacity:1;transform:scale(1.1)}100%{opacity:1;transform:scale(1)}}`;
        document.head.appendChild(stylePetalAppear);

        // ============================================================
        //  完整旅程
        // ============================================================
        async function startFullJourney() {
            // 1. 祝福语飘落
            await startBlessingRain();

            // 2. 清空祝福语 → 星尘粒子汇聚成玫瑰
            document.querySelectorAll('.bless').forEach(el => el.remove());
            await createStardustAndConverge();

            // 3. 隐藏卡片
            document.querySelectorAll('.card').forEach(c => c.style.display = 'none');
        }

        console.log('💕 星尘玫瑰已加载！');
    </script>

</body>
</html>
