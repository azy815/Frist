<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>你爱我吗 💕 星尘玫瑰</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            min-height: 100vh;
            overflow: hidden;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            padding: 16px;
            background: #fff0f5;
            background: linear-gradient(145deg, #fff5f7, #ffe8ee, #ffdee8, #fff0f5);
            background-size: 400% 400%;
            animation: bgShift 20s ease infinite;
            overflow: hidden;
            position: relative;
        }
        @keyframes bgShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* ===== 不透明粉色背景板 ===== */
        .card {
            position: relative;
            z-index: 20;
            background: #fce4ec;
            background: linear-gradient(145deg, #fce4ec, #f8d4de, #f5c8d4);
            padding: 32px 20px;
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(200, 100, 120, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin: 0 auto;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .card.hide {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }

        .big-heart {
            font-size: 56px;
            animation: pulse 1.6s ease-in-out infinite;
            display: inline-block;
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
        }
        .question {
            font-size: 24px;
            font-weight: 700;
            color: #5a3d4a;
            margin: 10px 0 4px;
        }
        .hint {
            color: rgba(90, 61, 74, 0.6);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .love-verse {
            color: rgba(90, 61, 74, 0.5);
            font-size: 13px;
            font-weight: 300;
            letter-spacing: 2px;
            margin-top: 14px;
            border-top: 1px solid rgba(200, 100, 120, 0.15);
            padding-top: 14px;
            font-style: italic;
            line-height: 1.6;
        }
        .love-verse .highlight {
            color: #d47a8a;
            font-weight: 500;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 60px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 100px;
            touch-action: manipulation;
            user-select: none;
        }
        .btn:active {
            transform: scale(0.94);
        }
        .btn-love {
            background: linear-gradient(135deg, #f5a0b0, #e88090);
            color: #fff;
            box-shadow: 0 6px 30px rgba(232, 128, 144, 0.25);
        }
        .btn-hate {
            background: rgba(200, 150, 160, 0.2);
            color: rgba(90, 61, 74, 0.5);
            border: 1px solid rgba(200, 150, 160, 0.2);
        }
        .btn-primary {
            background: linear-gradient(135deg, #e8b0c0, #d490a0);
            color: #fff;
            box-shadow: 0 6px 30px rgba(212, 144, 160, 0.25);
        }
        .result {
            margin-top: 18px;
            font-size: 18px;
            font-weight: 600;
            color: #5a3d4a;
            min-height: 44px;
        }
        .card-stage2 {
            display: none;
        }
        .card-stage2.active {
            display: block;
        }

        /* ===== 祝福语 ===== */
        .bless {
            position: fixed;
            pointer-events: none;
            z-index: 25;
            font-size: 16px;
            font-weight: 600;
            color: rgba(180, 100, 120, 0.8);
            padding: 8px 18px;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            white-space: nowrap;
            animation: floatBless linear forwards;
            opacity: 0;
        }
        @keyframes floatBless {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.85);
            }
            10% {
                opacity: 0.9;
                transform: translateY(0) scale(1);
            }
            85% {
                opacity: 0.9;
                transform: translateY(-120px) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-200px) scale(0.9);
            }
        }

        /* ===== 玫瑰容器 ===== */
        #roseContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 30;
            display: none;
            justify-content: center;
            align-items: center;
        }
        #roseContainer.active {
            display: flex;
        }

        #roseWrapper {
            position: relative;
            width: 60vmin;
            height: 60vmin;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }
        #roseWrapper.zoomed {
            transform: scale(1.4);
        }

        /* ===== 极细星尘粒子 ===== */
        .dust-particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            will-change: transform, opacity;
            animation: dustTwinkle var(--dur) ease-in-out infinite alternate;
        }
        @keyframes dustTwinkle {
            0% {
                opacity: 0.1;
                transform: scale(0.2);
            }
            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* ===== 星星光环 ===== */
        .halo-star {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: orbitStar linear infinite;
            box-shadow: 0 0 15px currentColor;
        }
        @keyframes orbitStar {
            0% {
                transform: rotate(0deg) translateX(var(--radius)) rotate(0deg);
                opacity: 0.3;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: rotate(360deg) translateX(var(--radius)) rotate(-360deg);
                opacity: 0.3;
            }
        }

        /* ===== 手机适配 ===== */
        @media (max-width: 420px) {
            .card {
                padding: 24px 16px;
                max-width: 100%;
            }
            .big-heart {
                font-size: 44px;
            }
            .question {
                font-size: 20px;
            }
            .btn {
                padding: 12px 20px;
                font-size: 16px;
                min-width: 80px;
            }
            .bless {
                font-size: 13px;
                padding: 6px 12px;
            }
            .love-verse {
                font-size: 12px;
            }
            #roseWrapper {
                width: 80vmin;
                height: 80vmin;
            }
        }
        @media (max-width: 370px) {
            .card {
                padding: 20px 12px;
            }
            .big-heart {
                font-size: 36px;
            }
            .question {
                font-size: 18px;
            }
            .btn {
                padding: 10px 16px;
                font-size: 14px;
                min-width: 70px;
            }
            .bless {
                font-size: 11px;
                padding: 5px 10px;
            }
            .love-verse {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 第一阶段 ===== -->
    <div class="card" id="stage1">
        <div class="big-heart" id="bigHeart">❤️</div>
        <div class="question" id="questionEl">你爱我吗？</div>
        <div class="hint" id="hintEl">💖 认真回答哦 💖</div>
        <div class="btn-group">
            <button class="btn btn-love" id="btnLove">爱你 💕</button>
            <button class="btn btn-hate" id="btnHate">不爱 😢</button>
        </div>
        <div class="result" id="resultMsg"></div>
        <div class="love-verse" id="verse1">
            ✦ 我们的故事还要继续，<span class="highlight">先不要退出</span> ✦
        </div>
    </div>

    <!-- ===== 第二阶段 ===== -->
    <div class="card card-stage2" id="stage2">
        <div class="big-heart" id="bigHeart2">💕</div>
        <div class="question" id="questionEl2">你愿意继续往下看吗？</div>
        <div class="hint" id="hintEl2">🌹 后面有惊喜哦 🌹</div>
        <div class="btn-group">
            <button class="btn btn-primary" id="btnYes">愿意 ❤️</button>
            <button class="btn btn-hate" id="btnNo">不愿意 😢</button>
        </div>
        <div class="result" id="resultMsg2"></div>
        <div class="love-verse" id="verse2">
            ✦ 每一步都是 <span class="highlight">爱的印记</span>，别走开 ✦
        </div>
    </div>

    <!-- ===== 玫瑰容器 ===== -->
    <div id="roseContainer">
        <div id="roseWrapper"></div>
    </div>

    <script>
        // ============================================================
        //  第一阶段
        // ============================================================
        const btnLove = document.getElementById('btnLove');
        const btnHate = document.getElementById('btnHate');
        const resultMsg = document.getElementById('resultMsg');
        const bigHeart = document.getElementById('bigHeart');
        const questionEl = document.getElementById('questionEl');
        const hintEl = document.getElementById('hintEl');
        const verse1 = document.getElementById('verse1');
        const stage1 = document.getElementById('stage1');
        const stage2 = document.getElementById('stage2');

        let hateClickCount = 0;
        const hateMsgs = ['你再想想？😠', '真的不爱吗？🥺', '再给你一次机会！😡', '呜呜呜我伤心了 💔'];

        function launchHearts(count) {
            const emojis = ['❤️', '💕', '💖', '✨', '💗', '🌸'];
            return new Promise((resolve) => {
                let completed = 0;
                for (let i = 0; i < count; i++) {
                    setTimeout(() => {
                        const el = document.createElement('div');
                        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                        el.style.cssText =
                            `position:fixed;pointer-events:none;z-index:9999;font-size:${20+Math.random()*26}px;left:${10+Math.random()*80}vw;top:${10+Math.random()*80}vh;animation:floatUp ${1.8+Math.random()*1.2}s ease-out forwards;`;
                        document.body.appendChild(el);
                        setTimeout(() => el.remove(), 3000);
                        completed++;
                        if (completed === count) setTimeout(resolve, 500);
                    }, i * 70);
                }
            });
        }
        const styleHeart = document.createElement('style');
        styleHeart.textContent =
            `@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-280px) scale(1.6)}}`;
        document.head.appendChild(styleHeart);

        btnLove.addEventListener('click', async function() {
            resultMsg.innerHTML = '💕 我也爱你！永远在一起！ 💕';
            resultMsg.style.color = '#d47a8a';
            bigHeart.textContent = '💕';
            questionEl.textContent = '我就知道！';
            hintEl.textContent = '从今天开始，你是我的全世界！🌍';
            verse1.innerHTML = '✦ 你是我 <span class="highlight">藏在微风里的喜欢</span> ✦';
            btnHate.style.display = 'none';
            btnLove.disabled = true;
            btnLove.style.opacity = '0.7';
            await launchHearts(28);
            stage1.style.display = 'none';
            stage2.classList.add('active');
        });

        btnHate.addEventListener('click', function() {
            hateClickCount++;
            const index = (hateClickCount - 1) % hateMsgs.length;
            resultMsg.innerHTML = hateMsgs[index];
            resultMsg.style.color = '#b08890';
            bigHeart.textContent = '💔';
            setTimeout(() => { bigHeart.textContent = '❤️'; }, 400);
            if (hateClickCount >= 4) {
                btnHate.textContent = '我错了！爱！❤️';
                btnHate.style.background = 'linear-gradient(135deg,#f5a0b0,#e88090)';
                btnHate.style.color = '#fff';
                btnHate.style.border = 'none';
                btnHate.onclick = function() { btnLove.click(); };
            }
        });

        // ============================================================
        //  第二阶段
        // ============================================================
        const btnYes = document.getElementById('btnYes');
        const btnNo = document.getElementById('btnNo');
        const resultMsg2 = document.getElementById('resultMsg2');
        const bigHeart2 = document.getElementById('bigHeart2');
        const questionEl2 = document.getElementById('questionEl2');
        const hintEl2 = document.getElementById('hintEl2');
        const verse2 = document.getElementById('verse2');

        let noClickCount = 0;
        const noMsgs = ['真的不想看吗？🥺', '再给你一次机会！😠', '求求你了嘛～😭', '最后问一次！💔'];

        btnYes.addEventListener('click', function() {
            resultMsg2.innerHTML = '🎉 太好了！让我们一起看下去！ 💕';
            resultMsg2.style.color = '#d490a0';
            bigHeart2.textContent = '🌟';
            questionEl2.textContent = '你真好！';
            hintEl2.textContent = '💫 愿所有的美好都属于你 💫';
            verse2.innerHTML = '✦ <span class="highlight">星辰大海</span> 不及你眼中光芒 ✦';
            btnNo.style.display = 'none';
            btnYes.disabled = true;
            btnYes.style.opacity = '0.7';
            startFullJourney();
        });

        btnNo.addEventListener('click', function() {
            noClickCount++;
            const index = (noClickCount - 1) % noMsgs.length;
            resultMsg2.innerHTML = noMsgs[index];
            resultMsg2.style.color = '#b08890';
            bigHeart2.textContent = '😢';
            setTimeout(() => { bigHeart2.textContent = '💕'; }, 400);
            if (noClickCount >= 4) {
                btnNo.textContent = '我愿意！❤️';
                btnNo.style.background = 'linear-gradient(135deg,#e8b0c0,#d490a0)';
                btnNo.style.color = '#fff';
                btnNo.style.border = 'none';
                btnNo.onclick = function() { btnYes.click(); };
            }
        });

        // ============================================================
        //  祝福语
        // ============================================================
        const blessings = [
            '✨ 愿所有美好都如期而至', '🌸 你是我藏在微风里的喜欢',
            '💫 星星温柔，人间浪漫', '🌙 月光所至，万事胜意',
            '🌺 愿你眼里有光，心中有爱', '🍀 幸运常伴，笑靥如花',
            '💖 心动不止，温柔不息', '🌊 山高水长，来日方长',
            '🎈 每一天都是新的开始', '🌈 生活明朗，万物可爱',
            '🌟 你本身就是最好的礼物', '💕 爱意随风起，风止意难平'
        ];

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
        let usedBlessings = [];

        function getNextBlessing() {
            if (usedBlessings.length === 0) usedBlessings = shuffleArray([...blessings]);
            return usedBlessings.pop();
        }

        const gridCols = 3,
            gridRows = 5;
        let availableGrids = [];

        function initGrids() {
            availableGrids = [];
            for (let row = 0; row < gridRows; row++) {
                for (let col = 0; col < gridCols; col++) {
                    availableGrids.push({ row, col });
                }
            }
            availableGrids = shuffleArray(availableGrids);
        }

        function getGridPosition() {
            if (availableGrids.length === 0) initGrids();
            const grid = availableGrids.pop();
            const colWidth = 100 / gridCols,
                rowHeight = 100 / gridRows;
            let left = grid.col * colWidth + colWidth / 2 + (Math.random() - 0.5) * colWidth * 0.6;
            let top = grid.row * rowHeight + rowHeight / 2 + (Math.random() - 0.5) * rowHeight * 0.6;
            return { left: Math.max(2, Math.min(98, left)), top: Math.max(2, Math.min(98, top)) };
        }

        let activeBlessElements = [];
        const MAX_BLESS = 12;
        let blessCount = 0;
        const TOTAL_BLESS = 12;

        function createBless() {
            if (activeBlessElements.length >= MAX_BLESS || blessCount >= TOTAL_BLESS) return;
            const pos = getGridPosition();
            const el = document.createElement('div');
            el.className = 'bless';
            el.textContent = getNextBlessing();
            el.style.left = pos.left + 'vw';
            el.style.top = pos.top + 'vh';
            const scale = 0.75 + Math.random() * 0.5;
            el.style.fontSize = (13 + Math.random() * 11) + 'px';
            el.style.transform = `scale(${scale})`;
            const duration = 12 + Math.random() * 8;
            el.style.animationDuration = duration + 's';
            document.body.appendChild(el);
            activeBlessElements.push(el);
            blessCount++;
            setTimeout(() => {
                if (el.parentNode) {
                    el.parentNode.removeChild(el);
                    const idx = activeBlessElements.indexOf(el);
                    if (idx > -1) activeBlessElements.splice(idx, 1);
                }
            }, duration * 1000 + 300);
        }

        function startBlessingRain() {
            return new Promise((resolve) => {
                blessCount = 0;
                activeBlessElements = [];
                initGrids();
                for (let i = 0; i < TOTAL_BLESS; i++) {
                    setTimeout(() => createBless(), i * 600);
                }
                const checkDone = setInterval(() => {
                    if (blessCount >= TOTAL_BLESS && activeBlessElements.length === 0) {
                        clearInterval(checkDone);
                        setTimeout(resolve, 500);
                    }
                }, 500);
            });
        }

        // ============================================================
        //  极细星尘玫瑰
        // ============================================================

        function getRoseDustData() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const cx = w / 2;
            const cy = h / 2 - 20;
            const baseSize = Math.min(w, h) * 0.3;

            const particles = [];
            const layers = [
                { count: 100, radius: 1.0, size: 0.6, color: 'pink-dark' },
                { count: 130, radius: 0.85, size: 0.5, color: 'pink' },
                { count: 150, radius: 0.7, size: 0.4, color: 'pink-light' },
                { count: 170, radius: 0.55, size: 0.35, color: 'pink' },
                { count: 190, radius: 0.4, size: 0.3, color: 'pink-light' },
                { count: 200, radius: 0.25, size: 0.25, color: 'pink' }
            ];

            const colorMap = {
                'pink': ['#ffb6d9', '#ff8eb5', '#ff6b9d'],
                'pink-light': ['#ffd1e8', '#ffb09a', '#ff8a80'],
                'pink-dark': ['#e88ab0', '#d4707a', '#d44a7a'],
                'gold': ['#ffd700', '#f0a030', '#ffb347'],
                'green': ['#7ddfa0', '#5ccf8a', '#3da86a']
            };

            layers.forEach((layer, li) => {
                const baseAngle = (li * 25) % 360;
                for (let i = 0; i < layer.count; i++) {
                    const angle = (i / layer.count) * 360 + baseAngle + (Math.random() - 0.5) * 20;
                    const rad = angle * Math.PI / 180;
                    const r = layer.radius * baseSize * (0.8 + Math.random() * 0.2);
                    const x = cx + r * Math.cos(rad) - 3;
                    const y = cy + r * Math.sin(rad) * 0.6 - 3;
                    const colors = colorMap[layer.color] || colorMap['pink'];
                    particles.push({
                        x: x,
                        y: y,
                        size: 0.5 + Math.random() * 1.5,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        twinkleSpeed: 1.2 + Math.random() * 2,
                        layer: li
                    });
                }
            });

            // 金色点缀（更细）
            for (let i = 0; i < 80; i++) {
                const angle = Math.random() * 360;
                const rad = angle * Math.PI / 180;
                const r = (0.1 + Math.random() * 1.1) * baseSize;
                const x = cx + r * Math.cos(rad) - 2;
                const y = cy + r * Math.sin(rad) * 0.6 - 2;
                particles.push({
                    x: x,
                    y: y,
                    size: 0.5 + Math.random() * 1.2,
                    color: ['#ffd700', '#ffb347', '#ffe066'][Math.floor(Math.random() * 3)],
                    twinkleSpeed: 1.5 + Math.random() * 2.5,
                    layer: 6,
                    isGold: true
                });
            }

            // 叶子粒子（更细）
            const leafCenters = [
                { angle: -40, dist: 1.2 },
                { angle: -20, dist: 1.25 },
                { angle: 210, dist: 1.2 },
                { angle: 230, dist: 1.25 }
            ];
            leafCenters.forEach((lc) => {
                const rad = lc.angle * Math.PI / 180;
                const r = lc.dist * baseSize * 0.65;
                const cx2 = cx + r * Math.cos(rad);
                const cy2 = cy + r * Math.sin(rad) * 0.6 + 10;
                for (let i = 0; i < 50; i++) {
                    const angleOff = (Math.random() - 0.5) * 50;
                    const radOff = angleOff * Math.PI / 180;
                    const distOff = (0.3 + Math.random() * 0.5) * baseSize * 0.3;
                    const x = cx2 + distOff * Math.cos(radOff);
                    const y = cy2 + distOff * Math.sin(radOff) * 0.6;
                    particles.push({
                        x: x,
                        y: y,
                        size: 0.5 + Math.random() * 1.2,
                        color: ['#7ddfa0', '#5ccf8a', '#a8f0c0'][Math.floor(Math.random() * 3)],
                        twinkleSpeed: 1 + Math.random() * 2,
                        layer: 7,
                        isLeaf: true
                    });
                }
            });

            return particles;
        }

        function createDustRose() {
            return new Promise((resolve) => {
                const container = document.getElementById('roseContainer');
                const wrapper = document.getElementById('roseWrapper');
                container.innerHTML = '';
                wrapper.innerHTML = '';
                container.classList.add('active');

                const dustData = getRoseDustData();
                const total = dustData.length;
                let placed = 0;

                dustData.forEach((d, index) => {
                    const el = document.createElement('div');
                    el.className = 'dust-particle';
                    const size = d.size;
                    el.style.width = size + 'px';
                    el.style.height = size + 'px';
                    el.style.background = d.color;
                    el.style.boxShadow = `0 0 ${4+size*4}px ${d.color}`;
                    el.style.setProperty('--dur', d.twinkleSpeed + 's');

                    const startX = 5 + Math.random() * 90;
                    const startY = 5 + Math.random() * 90;
                    el.style.left = startX + 'vw';
                    el.style.top = startY + 'vh';
                    el.style.opacity = '0.5';

                    document.body.appendChild(el);

                    setTimeout(() => {
                        el.style.transition =
                            `all ${0.6+Math.random()*0.8}s cubic-bezier(0.34, 1.56, 0.64, 1)`;
                        el.style.left = d.x + 'px';
                        el.style.top = d.y + 'px';
                        el.style.opacity = '1';

                        setTimeout(() => {
                            const cloned = el.cloneNode(true);
                            cloned.style.transition = 'none';
                            cloned.style.left = (d.x - container.getBoundingClientRect()
                                .left) + 'px';
                            cloned.style.top = (d.y - container.getBoundingClientRect()
                                .top) + 'px';
                            cloned.style.position = 'absolute';
                            cloned.style.opacity = '1';
                            cloned.style.width = size + 'px';
                            cloned.style.height = size + 'px';
                            cloned.style.background = d.color;
                            cloned.style.boxShadow = `0 0 ${4+size*4}px ${d.color}`;
                            cloned.style.animation =
                                `dustTwinkle ${d.twinkleSpeed}s ease-in-out infinite alternate`;
                            wrapper.appendChild(cloned);
                            el.remove();
                            placed++;
                            if (placed === total) {
                                setTimeout(() => {
                                    wrapper.onclick = function() {
                                        wrapper.classList.toggle('zoomed');
                                    };
                                    createHaloStars(wrapper, container);
                                    resolve();
                                }, 300);
                            }
                        }, 100);
                    }, 100 + index * 12);
                });
            });
        }

        // ===== 星星光环 =====
        function createHaloStars(wrapper, container) {
            const colors = ['#ffb6d9', '#ffd700', '#ff8eb5', '#ffffff', '#ff6b9d', '#a8d8ff'];
            const count = 20 + Math.floor(Math.random() * 16);
            const rect = container.getBoundingClientRect();
            const cx = rect.width / 2;
            const cy = rect.height / 2;
            const baseRadius = Math.min(rect.width, rect.height) * 0.42;

            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'halo-star';
                const size = 1.5 + Math.random() * 3.5;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                const color = colors[Math.floor(Math.random() * colors.length)];
                star.style.background = color;
                star.style.color = color;
                star.style.boxShadow = `0 0 ${8+Math.random()*18}px ${color}`;
                const radius = baseRadius * (0.7 + Math.random() * 0.3);
                star.style.setProperty('--radius', radius + 'px');
                star.style.left = (cx - size / 2) + 'px';
                star.style.top = (cy - size / 2) + 'px';
                const duration = 8 + Math.random() * 12;
                star.style.animationDuration = duration + 's';
                star.style.animationDelay = (Math.random() * 5) + 's';
                wrapper.appendChild(star);
            }
        }

        // ============================================================
        //  完整旅程（弹窗提前消失）
        // ============================================================
        async function startFullJourney() {
            // 1. 祝福语飘落
            await startBlessingRain();

            // 2. 清空祝福语
            document.querySelectorAll('.bless').forEach(el => el.remove());

            // 3. 弹窗消失（在星辰出现之前）
            document.querySelectorAll('.card').forEach(c => c.classList.add('hide'));

            // 4. 等待弹窗淡出完成
            await new Promise(r => setTimeout(r, 500));

            // 5. 星尘粒子汇聚成玫瑰
            await createDustRose();
        }

        console.log('💕 极细星尘玫瑰已加载！');
    </script>

</body>
</html>
