<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>你爱我吗 💕 冰晶玫瑰</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
            overflow: hidden;
            background: #0a0a1a;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
            padding: 16px;
            background: linear-gradient(135deg, #0a0a1a, #1a0a2e, #0d1b2a, #1a0a2e);
            background-size: 400% 400%;
            animation: bgShift 30s ease infinite;
            overflow: hidden;
            position: relative;
        }

        @keyframes bgShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .card {
            position: relative;
            z-index: 20;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 32px 20px;
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.4s ease;
            margin: 0 auto;
        }

        .big-heart {
            font-size: 56px;
            line-height: 1.2;
            animation: pulse 1.6s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
        }

        .question {
            font-size: 24px;
            font-weight: 700;
            color: #f0e6ff;
            margin: 10px 0 4px;
            letter-spacing: 0.5px;
            line-height: 1.3;
            text-shadow: 0 0 20px rgba(255, 200, 255, 0.2);
        }

        .hint {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 20px;
            opacity: 0.8;
            font-weight: 500;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 60px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            flex: 0 1 auto;
            min-width: 100px;
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        .btn:active {
            transform: scale(0.94);
        }

        .btn-love {
            background: linear-gradient(135deg, #ff6b81, #ee5a6f);
            color: #fff;
        }

        .btn-hate {
            background: rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #a18cd1, #8b7bc8);
            color: #fff;
        }

        .result {
            margin-top: 18px;
            font-size: 18px;
            font-weight: 600;
            color: #f0e6ff;
            min-height: 44px;
            transition: all 0.3s;
            line-height: 1.4;
        }

        .card-stage2 {
            display: none;
        }
        .card-stage2.active {
            display: block;
        }

        /* ===== 祝福语 ===== */
        .bless {
            position: fixed;
            pointer-events: none;
            z-index: 10;
            font-size: 16px;
            font-weight: 600;
            color: #f0e6ff;
            padding: 8px 18px;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 30px rgba(255, 200, 255, 0.05), inset 0 0 30px rgba(255, 200, 255, 0.02);
            white-space: nowrap;
            animation: floatBless linear forwards;
            transform-origin: center;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            letter-spacing: 0.5px;
            opacity: 0;
            text-shadow: 0 0 20px rgba(255, 200, 255, 0.15);
        }

        @keyframes floatBless {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.85) rotate(-3deg);
            }
            10% {
                opacity: 1;
                transform: translateY(0) scale(1) rotate(0deg);
            }
            85% {
                opacity: 1;
                transform: translateY(-120px) scale(1) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-200px) scale(0.9) rotate(3deg);
            }
        }

        /* ===== 星光粒子 ===== */
        .star-particle {
            position: fixed;
            pointer-events: none;
            z-index: 15;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
            box-shadow: 0 0 var(--glow-size) var(--glow-color);
        }

        @keyframes twinkle {
            0% {
                opacity: 0.2;
                transform: scale(0.3);
            }
            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* ===== 冰晶玫瑰容器 ===== */
        #roseContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 30;
            display: none;
            justify-content: center;
            align-items: center;
        }

        #roseContainer.active {
            display: flex;
        }

        /* ===== 花瓣 ===== */
        .petal {
            position: absolute;
            border-radius: 50% 50% 50% 0;
            transform-origin: bottom center;
            opacity: 0;
            animation: none;
        }

        .petal.pink {
            background: radial-gradient(ellipse at 30% 30%, #ffb6d9, #ff6b9d, #d44a7a);
            box-shadow: 0 0 25px rgba(255, 100, 150, 0.4), inset 0 -10px 30px rgba(200, 50, 100, 0.3);
            border: 1px solid rgba(255, 200, 220, 0.2);
        }

        .petal.pink-light {
            background: radial-gradient(ellipse at 30% 30%, #ffd1e8, #ff8eb5, #e85a8a);
            box-shadow: 0 0 20px rgba(255, 150, 200, 0.3), inset 0 -10px 30px rgba(200, 80, 130, 0.2);
            border: 1px solid rgba(255, 200, 220, 0.15);
        }

        .petal.pink-dark {
            background: radial-gradient(ellipse at 30% 30%, #e88ab0, #d44a7a, #b03060);
            box-shadow: 0 0 30px rgba(200, 60, 120, 0.4), inset 0 -10px 30px rgba(150, 30, 70, 0.3);
            border: 1px solid rgba(200, 100, 150, 0.2);
        }

        .petal.green {
            background: radial-gradient(ellipse at 30% 30%, #7ddfa0, #3da86a, #1a7a40);
            box-shadow: 0 0 20px rgba(60, 200, 120, 0.3), inset 0 -10px 30px rgba(20, 100, 50, 0.3);
            border: 1px solid rgba(100, 220, 150, 0.15);
        }

        .petal.green-light {
            background: radial-gradient(ellipse at 30% 30%, #a8f0c0, #5ccf8a, #2a9a5a);
            box-shadow: 0 0 15px rgba(100, 220, 150, 0.2), inset 0 -10px 30px rgba(30, 120, 60, 0.2);
            border: 1px solid rgba(150, 240, 180, 0.12);
        }

        /* ===== 亮粒子点缀 ===== */
        .sparkle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: sparklePulse 1.5s ease-in-out infinite alternate;
            box-shadow: 0 0 15px currentColor;
        }

        @keyframes sparklePulse {
            0% {
                opacity: 0.3;
                transform: scale(0.5);
            }
            100% {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 420px) {
            .card {
                padding: 24px 16px;
                max-width: 100%;
            }
            .big-heart {
                font-size: 44px;
            }
            .question {
                font-size: 20px;
            }
            .btn {
                padding: 12px 20px;
                font-size: 16px;
                min-width: 80px;
            }
            .bless {
                font-size: 13px;
                padding: 6px 12px;
            }
        }

        @media (max-width: 370px) {
            .card {
                padding: 20px 12px;
            }
            .big-heart {
                font-size: 36px;
            }
            .question {
                font-size: 18px;
            }
            .btn {
                padding: 10px 16px;
                font-size: 14px;
                min-width: 70px;
            }
            .bless {
                font-size: 11px;
                padding: 5px 10px;
            }
        }
    </style>
</head>
<body>

    <!-- 第一阶段 -->
    <div class="card" id="stage1">
        <div class="big-heart" id="bigHeart">❤️</div>
        <div class="question" id="questionEl">你爱我吗？</div>
        <div class="hint" id="hintEl">💖 认真回答哦 💖</div>
        <div class="btn-group">
            <button class="btn btn-love" id="btnLove">爱你 💕</button>
            <button class="btn btn-hate" id="btnHate">不爱 😢</button>
        </div>
        <div class="result" id="resultMsg"></div>
    </div>

    <!-- 第二阶段 -->
    <div class="card card-stage2" id="stage2">
        <div class="big-heart" id="bigHeart2">💕</div>
        <div class="question" id="questionEl2">你愿意继续往下看吗？</div>
        <div class="hint" id="hintEl2">🌹 后面有惊喜哦 🌹</div>
        <div class="btn-group">
            <button class="btn btn-primary" id="btnYes">愿意 ❤️</button>
            <button class="btn btn-hate" id="btnNo">不愿意 😢</button>
        </div>
        <div class="result" id="resultMsg2"></div>
    </div>

    <!-- 冰晶玫瑰容器 -->
    <div id="roseContainer"></div>

    <script>
        // ============================================================
        //  第一阶段：你爱我吗？
        // ============================================================

        const btnLove = document.getElementById('btnLove');
        const btnHate = document.getElementById('btnHate');
        const resultMsg = document.getElementById('resultMsg');
        const bigHeart = document.getElementById('bigHeart');
        const questionEl = document.getElementById('questionEl');
        const hintEl = document.getElementById('hintEl');
        const stage1 = document.getElementById('stage1');
        const stage2 = document.getElementById('stage2');

        let hateClickCount = 0;
        const hateMsgs = ['你再想想？😠', '真的不爱吗？🥺', '再给你一次机会！😡', '呜呜呜我伤心了 💔'];

        // ===== 爱心烟花 =====
        function launchHearts(count) {
            const emojis = ['❤️', '💕', '💖', '✨', '💗', '🌸'];
            return new Promise((resolve) => {
                let completed = 0;
                for (let i = 0; i < count; i++) {
                    setTimeout(() => {
                        const el = document.createElement('div');
                        el.className = 'float-heart';
                        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                        el.style.cssText = `
                                position:fixed;pointer-events:none;z-index:9999;
                                font-size:${20+Math.random()*26}px;
                                left:${10+Math.random()*80}vw;
                                top:${10+Math.random()*80}vh;
                                animation:floatUp ${1.8+Math.random()*1.2}s ease-out forwards;
                            `;
                        document.body.appendChild(el);
                        setTimeout(() => el.remove(), 3000);
                        completed++;
                        if (completed === count) setTimeout(resolve, 500);
                    }, i * 70);
                }
            });
        }

        // 注入爱心动画
        const styleHeart = document.createElement('style');
        styleHeart.textContent = `
                @keyframes floatUp {
                    0%{opacity:1;transform:translateY(0) scale(1) rotate(0deg);}
                    100%{opacity:0;transform:translateY(-280px) scale(1.6) rotate(30deg);}
                }
            `;
        document.head.appendChild(styleHeart);

        btnLove.addEventListener('click', async function() {
            resultMsg.innerHTML = '💕 我也爱你！永远在一起！ 💕';
            resultMsg.style.color = '#ff8eb5';
            bigHeart.textContent = '💕';
            questionEl.textContent = '我就知道！';
            hintEl.textContent = '从今天开始，你是我的全世界！🌍';
            btnHate.style.display = 'none';
            btnLove.disabled = true;
            btnLove.style.opacity = '0.7';
            btnLove.style.cursor = 'default';

            await launchHearts(28);
            stage1.style.display = 'none';
            stage2.classList.add('active');
        });

        btnHate.addEventListener('click', function() {
            hateClickCount++;
            const index = (hateClickCount - 1) % hateMsgs.length;
            resultMsg.innerHTML = hateMsgs[index];
            resultMsg.style.color = '#7f8c8d';
            bigHeart.textContent = '💔';
            setTimeout(() => { bigHeart.textContent = '❤️'; }, 400);
            if (hateClickCount >= 4) {
                btnHate.textContent = '我错了！爱！❤️';
                btnHate.style.background = 'linear-gradient(135deg,#ff6b81,#ee5a6f)';
                btnHate.style.color = '#fff';
                btnHate.onclick = function() { btnLove.click(); };
            }
        });

        // ============================================================
        //  第二阶段：愿意继续看吗？
        // ============================================================

        const btnYes = document.getElementById('btnYes');
        const btnNo = document.getElementById('btnNo');
        const resultMsg2 = document.getElementById('resultMsg2');
        const bigHeart2 = document.getElementById('bigHeart2');
        const questionEl2 = document.getElementById('questionEl2');
        const hintEl2 = document.getElementById('hintEl2');

        let noClickCount = 0;
        const noMsgs = ['真的不想看吗？🥺', '再给你一次机会！😠', '求求你了嘛～😭', '最后问一次！💔'];

        btnYes.addEventListener('click', function() {
            resultMsg2.innerHTML = '🎉 太好了！让我们一起看下去！ 💕';
            resultMsg2.style.color = '#c8b0e8';
            bigHeart2.textContent = '🌟';
            questionEl2.textContent = '你真好！';
            hintEl2.textContent = '💫 愿所有的美好都属于你 💫';
            btnNo.style.display = 'none';
            btnYes.disabled = true;
            btnYes.style.opacity = '0.7';
            btnYes.style.cursor = 'default';

            // 开始祝福语 + 完整流程
            startFullJourney();
        });

        btnNo.addEventListener('click', function() {
            noClickCount++;
            const index = (noClickCount - 1) % noMsgs.length;
            resultMsg2.innerHTML = noMsgs[index];
            resultMsg2.style.color = '#7f8c8d';
            bigHeart2.textContent = '😢';
            setTimeout(() => { bigHeart2.textContent = '💕'; }, 400);
            if (noClickCount >= 4) {
                btnNo.textContent = '我愿意！❤️';
                btnNo.style.background = 'linear-gradient(135deg,#a18cd1,#8b7bc8)';
                btnNo.style.color = '#fff';
                btnNo.onclick = function() { btnYes.click(); };
            }
        });

        // ============================================================
        //  祝福语 → 星光粒子 → 冰晶玫瑰 完整流程
        // ============================================================

        const blessings = [
            '✨ 愿所有美好都如期而至', '🌸 你是我藏在微风里的喜欢',
            '💫 星星温柔，人间浪漫', '🌙 月光所至，万事胜意',
            '🌺 愿你眼里有光，心中有爱', '🍀 幸运常伴，笑靥如花',
            '💖 心动不止，温柔不息', '🌊 山高水长，来日方长',
            '🎈 每一天都是新的开始', '🌈 生活明朗，万物可爱',
            '🌟 你本身就是最好的礼物', '💕 爱意随风起，风止意难平'
        ];

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        let usedBlessings = [];

        function getNextBlessing() {
            if (usedBlessings.length === 0) {
                usedBlessings = shuffleArray([...blessings]);
            }
            return usedBlessings.pop();
        }

        // ===== 网格均匀分布 =====
        const gridCols = 3,
            gridRows = 5;
        let availableGrids = [];

        function initGrids() {
            availableGrids = [];
            for (let row = 0; row < gridRows; row++) {
                for (let col = 0; col < gridCols; col++) {
                    availableGrids.push({ row, col });
                }
            }
            availableGrids = shuffleArray(availableGrids);
        }

        function getGridPosition() {
            if (availableGrids.length === 0) initGrids();
            const grid = availableGrids.pop();
            const colWidth = 100 / gridCols,
                rowHeight = 100 / gridRows;
            let left = grid.col * colWidth + colWidth / 2 + (Math.random() - 0.5) * colWidth * 0.6;
            let top = grid.row * rowHeight + rowHeight / 2 + (Math.random() - 0.5) * rowHeight * 0.6;
            return { left: Math.max(2, Math.min(98, left)), top: Math.max(2, Math.min(98, top)) };
        }

        let blessInterval = null;
        let activeBlessElements = [];
        const MAX_BLESS = 12;
        let blessCount = 0;
        const TOTAL_BLESS = 12;

        function createBless() {
            if (activeBlessElements.length >= MAX_BLESS || blessCount >= TOTAL_BLESS) return;

            const pos = getGridPosition();
            const el = document.createElement('div');
            el.className = 'bless';
            el.textContent = getNextBlessing();
            el.style.left = pos.left + 'vw';
            el.style.top = pos.top + 'vh';
            const scale = 0.75 + Math.random() * 0.5;
            el.style.fontSize = (13 + Math.random() * 11) + 'px';
            el.style.transform = `scale(${scale})`;
            const duration = 12 + Math.random() * 8;
            el.style.animationDuration = duration + 's';
            const hue = 320 + Math.random() * 40;
            el.style.borderColor = `hsla(${hue}, 70%, 80%, 0.15)`;
            el.style.background = `rgba(255,255,255,${0.04+Math.random()*0.06})`;

            document.body.appendChild(el);
            activeBlessElements.push(el);
            blessCount++;

            setTimeout(() => {
                if (el.parentNode) {
                    el.parentNode.removeChild(el);
                    const idx = activeBlessElements.indexOf(el);
                    if (idx > -1) activeBlessElements.splice(idx, 1);
                }
            }, duration * 1000 + 300);
        }

        function startBlessingRain() {
            return new Promise((resolve) => {
                blessCount = 0;
                activeBlessElements = [];
                initGrids();

                for (let i = 0; i < TOTAL_BLESS; i++) {
                    setTimeout(() => createBless(), i * 600);
                }

                // 等待所有祝福语飘完
                const checkDone = setInterval(() => {
                    if (blessCount >= TOTAL_BLESS && activeBlessElements.length === 0) {
                        clearInterval(checkDone);
                        setTimeout(resolve, 500);
                    }
                }, 500);
            });
        }

        // ===== 星光粒子 =====
        function createStarParticles(count) {
            return new Promise((resolve) => {
                const colors = ['#ffb6d9', '#ff8eb5', '#ff6b9d', '#d4a0e8', '#a8d8ff', '#7ddfa0', '#ffd700', '#ff69b4'];
                let completed = 0;

                for (let i = 0; i < count; i++) {
                    setTimeout(() => {
                        const el = document.createElement('div');
                        el.className = 'star-particle';
                        const size = 3 + Math.random() * 6;
                        const color = colors[Math.floor(Math.random() * colors.length)];
                        el.style.width = size + 'px';
                        el.style.height = size + 'px';
                        el.style.left = (2 + Math.random() * 96) + 'vw';
                        el.style.top = (2 + Math.random() * 96) + 'vh';
                        el.style.setProperty('--duration', (1.5 + Math.random() * 2.5) + 's');
                        el.style.setProperty('--glow-size', (10 + Math.random() * 30) + 'px');
                        el.style.setProperty('--glow-color', color);
                        el.style.background = color;
                        el.style.boxShadow = `0 0 ${10+Math.random()*30}px ${color}`;

                        document.body.appendChild(el);
                        completed++;
                        if (completed === count) {
                            setTimeout(resolve, 500);
                        }
                    }, i * 50);
                }
            });
        }

        function clearStars() {
            document.querySelectorAll('.star-particle').forEach(el => el.remove());
        }

        // ===== 冰晶玫瑰 =====
        function createIceRose() {
            const container = document.getElementById('roseContainer');
            container.innerHTML = '';
            container.classList.add('active');

            const centerX = 50,
                centerY = 45;
            const baseSize = Math.min(window.innerWidth, window.innerHeight) * 0.3;

            // 花瓣层数
            const layers = [{
                count: 8,
                radius: 1.0,
                size: 1.0,
                type: 'pink-dark'
            }, {
                count: 10,
                radius: 0.85,
                size: 0.9,
                type: 'pink'
            }, {
                count: 12,
                radius: 0.7,
                size: 0.8,
                type: 'pink-light'
            }, {
                count: 14,
                radius: 0.55,
                size: 0.7,
                type: 'pink'
            }, {
                count: 16,
                radius: 0.4,
                size: 0.6,
                type: 'pink-light'
            }, {
                count: 18,
                radius: 0.25,
                size: 0.5,
                type: 'pink'
            }];

            let petalCount = 0;
            const totalPetals = layers.reduce((sum, l) => sum + l.count, 0);

            layers.forEach((layer, li) => {
                const baseAngle = (li * 30) % 360;
                for (let i = 0; i < layer.count; i++) {
                    const angle = (i / layer.count) * 360 + baseAngle;
                    const rad = angle * Math.PI / 180;
                    const r = layer.radius * baseSize * (0.85 + Math.random() * 0.15);
                    const x = centerX + r * Math.cos(rad) - 15;
                    const y = centerY + r * Math.sin(rad) * 0.6 - 10;

                    const petal = document.createElement('div');
                    petal.className = `petal ${layer.type}`;
                    const size = (25 + Math.random() * 15) * layer.size;
                    petal.style.width = size + 'px';
                    petal.style.height = size * 1.4 + 'px';
                    petal.style.left = x + 'vw';
                    petal.style.top = y + 'vh';
                    petal.style.transform = `rotate(${angle+30+Math.random()*20-10}deg)`;
                    petal.style.animation = `petalAppear ${0.8+Math.random()*0.6}s ease-out forwards`;
                    petal.style.animationDelay = (petalCount * 40) + 'ms';

                    container.appendChild(petal);
                    petalCount++;
                }
            });

            // 叶子
            const leafPositions = [
                { angle: -40, dist: 1.2, size: 1.0 },
                { angle: -20, dist: 1.25, size: 0.9 },
                { angle: 210, dist: 1.2, size: 1.0 },
                { angle: 230, dist: 1.25, size: 0.9 }
            ];

            leafPositions.forEach((lp, idx) => {
                const rad = lp.angle * Math.PI / 180;
                const r = lp.dist * baseSize * 0.7;
                const x = centerX + r * Math.cos(rad) - 10;
                const y = centerY + r * Math.sin(rad) * 0.6 + 10;

                const leaf = document.createElement('div');
                leaf.className = `petal ${idx % 2 === 0 ? 'green' : 'green-light'}`;
                const size = (25 + Math.random() * 10) * lp.size;
                leaf.style.width = size * 1.6 + 'px';
                leaf.style.height = size * 1.2 + 'px';
                leaf.style.left = x + 'vw';
                leaf.style.top = y + 'vh';
                leaf.style.transform = `rotate(${lp.angle+90+Math.random()*20-10}deg)`;
                leaf.style.animation = `petalAppear ${0.8+Math.random()*0.4}s ease-out forwards`;
                leaf.style.animationDelay = (petalCount * 40) + 'ms';
                leaf.style.borderRadius = '50% 0 50% 50%';
                container.appendChild(leaf);
                petalCount++;
            });

            // 亮粒子点缀
            const sparkleColors = ['#ffb6d9', '#ff8eb5', '#ff6b9d', '#ffd700', '#7ddfa0', '#a8d8ff', '#ffffff', '#ff69b4'];
            const sparkleCount = 60 + Math.floor(Math.random() * 40);

            for (let i = 0; i < sparkleCount; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                const size = 2 + Math.random() * 5;
                const color = sparkleColors[Math.floor(Math.random() * sparkleColors.length)];
                sparkle.style.width = size + 'px';
                sparkle.style.height = size + 'px';
                sparkle.style.color = color;
                sparkle.style.background = color;
                sparkle.style.boxShadow = `0 0 ${10+Math.random()*25}px ${color}`;

                const angle = Math.random() * 360;
                const rad = angle * Math.PI / 180;
                const dist = (0.1 + Math.random() * 1.4) * baseSize;
                const x = centerX + dist * Math.cos(rad) - 3;
                const y = centerY + dist * Math.sin(rad) * 0.6 - 3;
                sparkle.style.left = x + 'vw';
                sparkle.style.top = y + 'vh';
                sparkle.style.animationDelay = (Math.random() * 3) + 's';
                sparkle.style.animationDuration = (1 + Math.random() * 2) + 's';
                sparkle.style.setProperty('--sparkle-delay', (Math.random() * 3) + 's');

                container.appendChild(sparkle);
            }

            // 注入花瓣动画
            const stylePetal = document.createElement('style');
            stylePetal.textContent = `
                    @keyframes petalAppear {
                        0% { opacity: 0; transform: scale(0) rotate(0deg); }
                        60% { opacity: 1; transform: scale(1.1) rotate(var(--rot, 0deg)); }
                        100% { opacity: 1; transform: scale(1) rotate(var(--rot, 0deg)); }
                    }
                `;
            document.head.appendChild(stylePetal);

            // 设置花瓣旋转变量
            document.querySelectorAll('.petal').forEach(p => {
                const rot = p.style.transform.match(/rotate\(([^)]+)\)/);
                if (rot) p.style.setProperty('--rot', rot[1]);
            });
        }

        // ===== 完整旅程 =====
        async function startFullJourney() {
            // 1. 祝福语
            await startBlessingRain();

            // 2. 清空祝福语 → 星光粒子
            document.querySelectorAll('.bless').forEach(el => el.remove());
            await createStarParticles(200);

            // 3. 等待3秒后，粒子汇聚成玫瑰
            await new Promise(r => setTimeout(r, 3000));

            // 4. 清空粒子 → 冰晶玫瑰
            clearStars();
            createIceRose();

            // 5. 隐藏卡片
            document.querySelectorAll('.card').forEach(c => c.style.display = 'none');
        }
    </script>

</body>
</html>
